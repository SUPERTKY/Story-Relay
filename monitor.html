<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ストーリーリレー（モニター）</title>
  <style>
:root{
  --bg:#070b18; --fg:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; --ok:#34d399; --danger:#ef4444;
  --ring-bg:#132036; --ring-fg:#9ec5ff; --ring-rest:#1f2937;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 800px at 20% 10%, #152048 0%, transparent 60%),
    radial-gradient(1000px 700px at 80% 90%, #2b1645 0%, transparent 55%),
    linear-gradient(160deg, #0b1022 0%, #121b3a 100%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
  display:grid; grid-template-rows:auto 1fr auto; gap:10px; padding:18px;
  overflow:hidden; animation:bgFloat 16s ease-in-out infinite alternate;
}
@keyframes bgFloat{
  0%{background-position:0 0,0 0,0 0; filter:hue-rotate(0deg)}
  100%{background-position:10px -14px,-12px 18px,0 0; filter:hue-rotate(10deg)}
}

/* ヘッダー */
#topbar{display:flex; align-items:center; gap:14px; justify-content:space-between}
.brand{font-weight:800; letter-spacing:.02em; opacity:.9}
.stat{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.badge{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  font-weight:700; color:#bfdbfe;
}
.small{font-size:.9rem; color:var(--muted); font-weight:600}

/* メイン */
#stage{
  display:grid; grid-template-columns: 320px 1fr; gap:18px; align-items:center;
  height: calc(100vh - 120px);
}
@media (max-width: 960px){ #stage{ grid-template-columns: 1fr; grid-auto-rows:auto 1fr } }

/* タイマー円 */
#ring{
  place-self:center;
  width:min(42vw,320px); aspect-ratio:1;
  border-radius:50%;
  background:
    conic-gradient(var(--ring-fg) calc(var(--p,0)*1%), var(--ring-rest) 0 100%);
  display:grid; place-items:center;
  box-shadow: 0 12px 40px rgba(0,0,0,.45), inset 0 0 40px rgba(96,165,250,.12);
  transition: background .8s linear;
}
#ringInner{
  width:78%; height:78%; border-radius:50%;
  background:linear-gradient(180deg,#0d1530,#101a3a);
  border:1px solid rgba(255,255,255,.12);
  display:grid; place-items:center; text-align:center; padding:8px;
}
#ringNum{ font-size:min(10vw,80px); font-weight:1000; letter-spacing:.02em }
#ringLabel{ margin-top:2px; font-size:1rem; color:var(--muted) }

/* ストーリー大表示 */
#storyWrap{
  position:relative; height:100%; overflow:hidden;
  background:rgba(6,10,24,.55); border:1px solid rgba(255,255,255,.12); border-radius:16px; backdrop-filter:blur(6px);
  box-shadow:0 10px 28px rgba(0,0,0,.4); padding:18px;
}
#concat{
  position:absolute; inset:0; padding:24px; overflow:auto;
  font-size: clamp(20px, 2.2vw, 42px); line-height:1.5; white-space:pre-wrap;
}
.hl{ background: rgba(96,165,250,.18); border-radius:8px; padding:0 .12em }

/* 画面オーバーレイ：カウントダウン／交代／終了 */
.overlay{
  position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:40;
  background:rgba(3,6,14,.82); backdrop-filter: blur(4px);
}
.overlay.show{ display:flex }
.countNum{
  position:relative; font-size:min(16vw,160px); font-weight:1000; letter-spacing:.02em; line-height:1;
  color:#eaf2ff; -webkit-text-stroke:6px rgba(255,255,255,.12);
  text-shadow: 0 0 22px rgba(96,165,250,.5), 0 0 48px rgba(59,130,246,.35);
  animation:pop .9s ease forwards, wobble .9s ease forwards;
}
@keyframes pop{ from{transform:scale(.85); opacity:.6} to{transform:scale(1); opacity:1} }
@keyframes wobble{0%{transform:translateZ(0)}40%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.startGlow{ color:#ffd76a; -webkit-text-stroke:0 transparent; text-shadow:0 0 28px #ffd76a, 0 0 64px #ffb300, 0 0 96px #ff9900 }
.nextMsg{
  font-size:min(8vw,72px); font-weight:900; letter-spacing:.02em; color:#eaf2ff; text-align:center;
  text-shadow:0 0 30px rgba(96,165,250,.5);
}
.fade-enter{ animation:fadeIn .5s ease both }
.fade-exit{ animation:fadeOut .5s ease both }
@keyframes fadeIn{ from{opacity:0} to{opacity:1} }
@keyframes fadeOut{ from{opacity:1} to{opacity:0} }

/* 終了演出：黒画面＆読み上げ */
#theEnd{ position:fixed; inset:0; background:#000; color:#fff; display:none; z-index:60; }
#theEnd.show{ display:block; animation: fadeIn .8s ease both }
#theEndInner{ max-width: min(90vw, 1100px); margin: 8vh auto; padding: 16px; }
#finLead{ font-size: clamp(20px, 3vw, 44px); opacity:.9; margin-bottom: 16px }
#finText{ font-size: clamp(20px, 2.2vw, 36px); line-height:1.6; white-space:pre-wrap }

/* 下部テロップ（現在◯人目） */
#ticker{
  text-align:center; opacity:.85; font-weight:700; letter-spacing:.02em;
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
  padding:8px 12px; border-radius:12px; margin-top:6px;
}

/* 音声有効化ボタン */
#audioGate{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:80;
  background:rgba(0,0,0,.6); color:#fff;
}
#audioGate button{
  font:inherit; font-weight:800; cursor:pointer;
  padding:14px 22px; border-radius:999px; border:1px solid rgba(255,255,255,.25);
  background:linear-gradient(180deg,#75b6ff,#3b82f6); color:#0b1220;
  box-shadow:0 12px 36px rgba(0,0,0,.5);
}

/* きらきら粒 */
.sparks{position:absolute; inset:0; pointer-events:none}
.spark{
  position:absolute; width:6px; height:6px; border-radius:50%;
  background:currentColor; filter:blur(.2px) drop-shadow(0 0 6px currentColor);
  animation:shoot 900ms ease-out forwards
}
@keyframes shoot{
  0%{transform:translate(0,0) scale(1);opacity:1}
  90%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.8);opacity:0}
}
  </style>
</head>
<body>
  <div id="topbar">
    <div class="brand">📺 ストーリーリレー・モニター</div>
    <div class="stat">
      <span class="badge">開催：<strong id="live">未検出</strong></span>
      <span class="badge">参加：<strong id="total">-</strong></span>
      <span class="badge">記録：<strong id="saved">-</strong></span>
      <span class="badge">現在：<strong id="now">- 人目</strong></span>
      <span class="small" id="dateLabel"></span>
    </div>
  </div>

  <div id="stage">
    <!-- 左：リングタイマー -->
    <div id="ring" aria-hidden="true">
      <div id="ringInner">
        <div id="ringNum">30</div>
        <div id="ringLabel">制限時間</div>
      </div>
    </div>

    <!-- 右：ストーリー表示 -->
    <div id="storyWrap">
      <div id="concat" aria-live="polite"></div>
      <div class="sparks" id="sparkLayer"></div>
    </div>
  </div>

  <div id="ticker">待機中…</div>

  <!-- カウントダウン／交代 演出 -->
  <div id="overlay" class="overlay" aria-hidden="true">
    <div id="overlayBox"></div>
  </div>

  <!-- 終了演出（黒画面＆読み上げ） -->
  <div id="theEnd" aria-hidden="true">
    <div id="theEndInner">
      <div id="finLead">完成した作品は…</div>
      <div id="finText"></div>
    </div>
  </div>

  <!-- 音声有効化 -->
  <div id="audioGate">
    <button id="audioEnable">🔊 音声を有効化</button>
  </div>

  <!-- オーディオ -->
  <audio id="bgm" src="assets/monitor_bgm.mp3" loop preload="auto"></audio>
  <audio id="seWhoosh" src="assets/whoosh.mp3" preload="auto"></audio>
  <audio id="seTick"   src="assets/tick.mp3"   preload="auto"></audio>
  <audio id="seBeep"   src="assets/beep.mp3"   preload="auto"></audio>

  <!-- Firebase v8（互換API） -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
/** ===== Firebase 設定 ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
  authDomain: "story-relay-ec15b.firebaseapp.com",
  databaseURL: "https://story-relay-ec15b-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "story-relay-ec15b",
  storageBucket: "story-relay-ec15b.appspot.com",
  messagingSenderId: "423778345800",
  appId: "1:423778345800:web:d72d3569869bc3a789c97d"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.database();

/** ===== DOM ===== */
const elLive  = document.getElementById('live');
const elTotal = document.getElementById('total');
const elSaved = document.getElementById('saved');
const elNow   = document.getElementById('now');
const elDate  = document.getElementById('dateLabel');

const ring = document.getElementById('ring');
const ringNum = document.getElementById('ringNum');

const ticker = document.getElementById('ticker');
const overlay = document.getElementById('overlay');
const overlayBox = document.getElementById('overlayBox');

const concatEl = document.getElementById('concat');
const sparkLayer = document.getElementById('sparkLayer');

const theEnd = document.getElementById('theEnd');
const finText = document.getElementById('finText');

const bgm = document.getElementById('bgm');
const seWhoosh = document.getElementById('seWhoosh');
const seTick = document.getElementById('seTick');
const seBeep = document.getElementById('seBeep');

const audioGate = document.getElementById('audioGate');
const audioEnable = document.getElementById('audioEnable');

/** ===== 状態 ===== */
const LIMIT = 30; // 秒（先生ページと合わせる）
const today = new Date().toISOString().split('T')[0];
elDate.textContent = today;

let basePath = '';        // まとめくくり/<date>/<N>人まとめ
let meta = { 参加人数: 0, 状態: 'live', 開始時刻: 0 };
let savedCount = 0;
let timerId = null;
let ringProgress = 0;
let storyConcat = '';
    // monitor.html
let serverOffset = 0; // ms
firebase.database().ref('/.info/serverTimeOffset').on('value', s=>{
  serverOffset = s.val() || 0;
});
    let turnStartAt = null; // ms (server 時刻)
const nowServer = () => Date.now() + serverOffset;



let rootOff = null, metaOff = null, sessOff = null;
let audioReady = false;

/** ===== 音声有効化 ===== */
audioEnable.addEventListener('click', async ()=>{
  try{
    // 無音再生してオーディオ解放
    await Promise.allSettled([ bgm.play(), seWhoosh.play(), seTick.play(), seBeep.play() ]);
  }catch(_){} finally{
    [bgm, seWhoosh, seTick, seBeep].forEach(a=>{ try{ a.pause(); a.currentTime=0; }catch(_){} });
    audioReady = true;
    audioGate.style.display='none';
  }
});

/** ===== 匿名ログイン（読み取りだけでも Auth あると安心） ===== */
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
  .catch(()=>{})
  .finally(async ()=>{
    try{ if(!auth.currentUser) await auth.signInAnonymously(); }catch(_){}
    attachDateWatcher();
  });

/** ===== 今日の最新セッションに追従 ===== */
function attachDateWatcher(){
  const dateRef = db.ref(`まとめくくり/${today}`);
  const fn = dateRef.on('value', snap=>{
    const obj = snap.val() || {};
    const keys = Object.keys(obj).filter(k=>k.endsWith('人まとめ'));
    if(keys.length===0){ switchSession(''); updateNoSession(); return; }
    // 開始時刻が最大のまとめを選択
    let bestKey = ''; let bestTs = -1;
    for(const k of keys){
      const ts = (obj[k] && obj[k]._meta && obj[k]._meta.開始時刻) || 0;
      if(ts > bestTs){ bestTs = ts; bestKey = k; }
    }
    const nextBase = `まとめくくり/${today}/${bestKey}`;
    switchSession(nextBase, bestTs);
  });
  rootOff = ()=> dateRef.off('value', fn);
}

function switchSession(nextPath, startTs){
  if(basePath === nextPath) return;

  // 旧監視解除
  if(metaOff){ metaOff(); metaOff=null; }
  if(sessOff){ sessOff(); sessOff=null; }
  basePath = nextPath;

  if(!basePath){ return; }

  // メタ監視
// 既存：metaRef.on('value', …) を下記に置換
const metaRef = db.ref(`${basePath}/_meta`);
const fn1 = metaRef.on('value', s=>{
  meta = s.val() || { 参加人数:0, 状態:'live' };
  elTotal.textContent = meta.参加人数 || 0;

  // サーバー基準の開始時刻
  turnStartAt = meta.ターン開始時刻 || null;

  // ★ running のときだけ（かつ開始時刻があるときだけ）同期タイマー始動
  if (meta.ターン状態 === 'running' && turnStartAt){
    stopTimer();
    startTimer(); // 同期版（下記③）
  } else {
    // 交代中・未開始・終了などは止める
    stopTimer();
    // 見た目を止めたい場合は、ここで setRing(0) なども可
  }

  refreshStatus();
});
metaOff = ()=> metaRef.off('value', fn1);



  // セッション全体監視（保存件数の把握・連結更新）
  const sessRef = db.ref(basePath);
  const fn2 = sessRef.on('value', s=>{
    const v = s.val() || {};
    const keys = Object.keys(v).filter(k=>/^\d+$/.test(k)).sort((a,b)=>Number(a)-Number(b));
    const newSaved = keys.length;
    const total = meta.参加人数 || 0;

    // 連結テキストを作り直し（安全）
    storyConcat = keys.map(k=> (v[k] && v[k].文字) || '').filter(Boolean).join(' ');
    concatEl.textContent = storyConcat;

    // 新規ターンが終わったら「交代演出」
    if(newSaved > savedCount){
      showSwitchOverlay(newSaved, total);
      // 次ターンのタイマーを再始動
      stopTimer(); startTimer();
      // ちょっときらきら
      burstSparks(32);
    }

    savedCount = newSaved;
    elSaved.textContent = savedCount;

    // 現在の「◯人目」= saved+1（上限total）
    const now = Math.min(savedCount + 1, Math.max(total, 1));
    elNow.textContent = `${now} 人目`;

    refreshStatus();
  });
  sessOff = ()=> sessRef.off('value', fn2);

  // セッション開始のカウントダウン（開始時刻が来たら）
  if(startTs){ runStartCountdown(); fadeInBgm(); startTimer(); }
}

/** ===== 表示ステータス更新 ===== */
function refreshStatus(){
  if(!basePath){
    elLive.textContent = '開催なし';
    ticker.textContent = '待機中…';
    return;
  }
  const total = meta.参加人数 || 0;

  if(meta.状態 === 'ended' || (total>0 && savedCount >= total)){
    elLive.textContent = '終了';
    ticker.textContent = '終了しました。';
    endSequence();
    return;
  }

  elLive.textContent = '開催中';
  const now = Math.min(savedCount + 1, Math.max(total, 1));
  ticker.textContent = `現在 ${now} 人目が入力中`;
}

/** ===== カウントダウン（3,2,1,スタート） ===== */
async function runStartCountdown(){
  showOverlayNumber('3'); await wait(900);
  showOverlayNumber('2'); await wait(900);
  showOverlayNumber('1'); await wait(900);
  showOverlayStart();     await wait(900);
  hideOverlay();
}
function showOverlayNumber(n){
  overlay.classList.add('show');
  overlayBox.innerHTML = `<div class="countNum">${n}</div>`;
  if(audioReady){ try{ seWhoosh.currentTime=0; seWhoosh.play(); }catch(_){ } }
}
function showOverlayStart(){
  overlay.classList.add('show');
  overlayBox.innerHTML = `<div class="countNum startGlow">スタート!</div>`;
  if(audioReady){ try{ seWhoosh.currentTime=0; seWhoosh.play(); }catch(_){ } }
}
function hideOverlay(){
  overlayBox.classList.add('fade-exit');
  setTimeout(()=>{
    overlay.classList.remove('show');
    overlayBox.className=''; overlayBox.innerHTML='';
  }, 450);
}

/** ===== 交代演出 ===== */
function showSwitchOverlay(done, total){
  overlay.classList.add('show');
  overlayBox.innerHTML = `<div class="nextMsg">次の人へ！<br><span style="font-size:.6em;opacity:.8">（${done}/${total} 人 終了）</span></div>`;
  setTimeout(hideOverlay, 1500);
}

/** ===== タイマー（30秒・リング＆チクタク） ===== */
// すでに serverOffset は取得済み
let turnStartAt = null;
const nowServer = () => Date.now() + serverOffset;

function startTimer(){
  stopTimer();
  timerId = setInterval(()=>{
    let left = LIMIT;
    if (turnStartAt){
      left = Math.ceil(LIMIT - (nowServer() - turnStartAt)/1000);
    }
    left = Math.max(0, Math.min(LIMIT, left));
    setRing(left);

    if(audioReady){
      if(left > 0 && left <= 5){
        try{ seBeep.currentTime=0; seBeep.play(); }catch(_){}
      }else if(left > 0){
        try{ seTick.currentTime=0; seTick.play(); }catch(_){}
      }
    }
    if(left<=0){ stopTimer(); }
  }, 1000);
}
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function setRing(t){
  ringNum.textContent = t;
  const p = Math.max(0, Math.min(100, t / LIMIT * 100));
  ring.style.setProperty('--p', (100 - p).toFixed(2));
}

function setRing(t){
  ringNum.textContent = t;
  const p = Math.max(0, Math.min(100, t / LIMIT * 100));
  ring.style.setProperty('--p', (100 - p).toFixed(2));
}

function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId=null; }
}


/** ===== BGM フェード ===== */
function fadeInBgm(){
  if(!audioReady) return;
  try{
    bgm.volume = 0; bgm.play().catch(()=>{});
    const id = setInterval(()=>{
      bgm.volume = Math.min(1, bgm.volume + 0.08);
      if(bgm.volume >= 1) clearInterval(id);
    }, 80);
  }catch(_){}
}
function fadeOutBgm(ms=2500){
  if(!audioReady) return Promise.resolve();
  return new Promise(res=>{
    const steps = 20; const step = (bgm.volume) / steps; const dt = ms/steps;
    let i=0;
    const id = setInterval(()=>{
      bgm.volume = Math.max(0, bgm.volume - step);
      if(++i>=steps){ clearInterval(id); try{ bgm.pause(); }catch(_){ } res(); }
    }, dt);
  });
}

/** ===== きらきら粒 ===== */
function burstSparks(n){
  const palette = ['#60a5fa','#93c5fd','#facc15','#fb923c','#34d399'];
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='spark'; s.style.color = palette[i%palette.length];
    const angle = Math.random()*Math.PI*2;
    const dist  = 160 + Math.random()*160;
    s.style.setProperty('--dx', Math.cos(angle)*dist+'px');
    s.style.setProperty('--dy', Math.sin(angle)*dist+'px');
    s.style.left='50%'; s.style.top='50%'; s.style.transform='translate(-50%,-50%)';
    sparkLayer.appendChild(s);
    setTimeout(()=> s.remove(), 950);
  }
}

/** ===== 終了演出：黒→「完成した作品は…」→読み上げ ===== */
let endedOnce = false;
async function endSequence(){
  if(endedOnce) return; endedOnce = true;
  stopTimer();
  await fadeOutBgm(2500);

  // 1) 真っ黒へフェードイン
  theEnd.classList.add('show');
  await wait(700);

  const lead = document.getElementById('finLead');
  const textEl = document.getElementById('finText');
  const finalText = storyConcat || '(本文なし)';

  // 2) 見出しだけ表示
  textEl.textContent = '';      // 本文はまだ出さない
  lead.style.display = 'block';

  // 明瞭＆速めの読み上げ（分割読み）
  const speak = (text)=> new Promise(resolve=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    u.rate = 1.18;          // ★ 少し速め
    u.pitch = 1.0;          // ★ くっきり
    u.volume = 1.0;
    const pick = speechSynthesis.getVoices().find(v=> v.lang && v.lang.startsWith('ja'));
    if(pick) u.voice = pick;
    u.onend = ()=> resolve();
    if(speechSynthesis.getVoices().length===0){
      speechSynthesis.onvoiceschanged = ()=> speechSynthesis.speak(u);
    }else{
      speechSynthesis.speak(u);
    }
  });

  // 3) 「完成した作品は……」を読み上げ
  try{ await speak('完成した作品は……'); }catch(_){}

  // 4) 見出しを消す → 本文を表示
  lead.style.display = 'none';
  textEl.textContent = finalText;

  // 5) 句読点ポーズ＋分割で読み上げ（聞き取りやすく）
  const normalized = finalText
    .replace(/、/g, '、 ')
    .replace(/。/g, '。 ')
    .replace(/\s+/g, ' ')
    .trim();

  const chunks = [];
  const maxLen = 80;
  let rest = normalized;
  while(rest.length){
    if(rest.length <= maxLen){ chunks.push(rest); break; }
    const tmp = rest.slice(0, maxLen);
    const idx = Math.max(tmp.lastIndexOf('。'), tmp.lastIndexOf('、'), tmp.lastIndexOf('！'), tmp.lastIndexOf('？'), tmp.lastIndexOf(' '));
    const cut = (idx > 20 ? idx+1 : maxLen);
    chunks.push(rest.slice(0, cut));
    rest = rest.slice(cut);
  }

  for(const c of chunks){
    try{ await speak(c); }catch(_){}
    await wait(80);
  }
}


/** ===== ユーティリティ ===== */
function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }
function updateNoSession(){
  elLive.textContent = '開催なし';
  elTotal.textContent = '-';
  elSaved.textContent = '-';
  elNow.textContent   = '- 人目';
