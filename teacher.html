<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Page</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #startBtn {
      padding: 16px 32px;
      font-size: 1.5rem;
      font-weight: bold;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      background: #60a5fa;
      color: #000;
      z-index: 1;
    }

    /* カウントダウン全画面 */
    #countdown {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.85);
      z-index: 9999; /* 最前面に出す */
      font-size: 6rem;
      font-weight: 900;
      color: white;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    #countdown.show {
      opacity: 1;
    }

    @keyframes pop {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .pop {
      animation: pop 0.8s ease forwards;
    }

    .start {
      color: #facc15;
      text-shadow: 0 0 20px #fbbf24, 0 0 40px #f59e0b;
      font-size: 7rem;
      animation: pop 1s ease forwards, blink 1s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to   { opacity: 0.6; }
    }
  </style>
</head>
<body>
  <button id="startBtn">スタート</button>
  <div id="countdown"></div>

  <script>
    const startBtn = document.getElementById("startBtn");
    const countdown = document.getElementById("countdown");

    startBtn.addEventListener("click", async () => {
      startBtn.style.display = "none";
      await runCountdown();
      alert("ゲーム開始！");
    });

    async function runCountdown() {
      countdown.classList.add("show");
      const seq = ["3", "2", "1", "スタート!"];
      for (let i = 0; i < seq.length; i++) {
        countdown.innerHTML = `<div class="${i === seq.length-1 ? "start" : "pop"}">${seq[i]}</div>`;
        await wait(1000);
      }
      countdown.classList.remove("show");
    }

    function wait(ms) {
      return new Promise(res => setTimeout(res, ms));
    }
  </script>
</body>
</html>
