<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Teacher</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    #countdown {
      font-size: 5em;
      opacity: 0;
      transition: opacity 0.5s;
    }

    #inputArea, #turnArea {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    input, button {
      font-size: 1.2em;
      padding: 8px 12px;
      border-radius: 8px;
      border: none;
      margin: 5px;
    }

    button {
      background: #4caf50;
      color: white;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #45a049;
    }

    #charCount {
      font-size: 0.9em;
      color: #ccc;
    }

    #timer {
      font-size: 1.5em;
      margin-top: 10px;
      color: #ffcc00;
    }
  </style>
</head>
<body>
  <h1>先生画面</h1>

  <!-- 参加人数・出席番号入力 -->
  <div id="setupArea">
    <input type="number" id="totalPlayers" placeholder="参加人数を入力">
    <input type="number" id="myNumber" placeholder="自分の出席番号を入力">
    <button id="startBtn">スタート</button>
  </div>

  <!-- カウントダウン -->
  <div id="countdown"></div>

  <!-- 入力エリア -->
  <div id="inputArea">
    <textarea id="storyInput" maxlength="35" rows="3" cols="40" placeholder="ここに入力(最大35文字)"></textarea>
    <div id="charCount">0 / 35</div>
    <button id="submitBtn">決定</button>
    <div id="timer">制限時間: 30</div>
  </div>

  <!-- ターン切替エリア -->
  <div id="turnArea">
    <h2 id="turnMessage">次の人に代わってね！</h2>
    <button id="nextTurnBtn">どうぞ！</button>
  </div>

  <audio id="bgm" src="assets/game_bgm.mp3" loop></audio>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    // === Firebase 設定 ===
const firebaseConfig = {
  apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
  authDomain: "story-relay-ec15b.firebaseapp.com",
  databaseURL: "https://story-relay-ec15b-default-rtdb.europe-west1.firebasedatabase.app/", // ← これに直す
  projectId: "story-relay-ec15b",
  storageBucket: "story-relay-ec15b.appspot.com",
  messagingSenderId: "423778345800",
  appId: "1:423778345800:web:d72d3569869bc3a789c97d"
};


    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // === DOM要素 ===
    const startBtn = document.getElementById("startBtn");
    const totalPlayersInput = document.getElementById("totalPlayers");
    const myNumberInput = document.getElementById("myNumber");
    const countdownEl = document.getElementById("countdown");
    const inputArea = document.getElementById("inputArea");
    const storyInput = document.getElementById("storyInput");
    const charCount = document.getElementById("charCount");
    const submitBtn = document.getElementById("submitBtn");
    const turnArea = document.getElementById("turnArea");
    const nextTurnBtn = document.getElementById("nextTurnBtn");
    const timerEl = document.getElementById("timer");
    const bgm = document.getElementById("bgm");

    let totalPlayers = 0;
    let currentPlayer = 1;
    let currentStory = "";
    let timer;
    let timeLeft = 30;

    // === スタートボタン ===
    startBtn.addEventListener("click", async () => {
      totalPlayers = parseInt(totalPlayersInput.value);
      const myNumber = myNumberInput.value.trim();

      if (!totalPlayers || !myNumber) {
        alert("参加人数と自分の番号を入力してください");
        return;
      }

      document.getElementById("setupArea").style.display = "none";

      await runCountdown();
      try { bgm.play(); } catch(e) { console.warn("BGM再生失敗:", e); }

      startTurn();
    });

    // === カウントダウン ===
    async function runCountdown() {
      const numbers = ["3", "2", "1", "スタート!"];
      for (let num of numbers) {
        countdownEl.innerText = num;
        countdownEl.style.opacity = 1;
        await new Promise(r => setTimeout(r, 1000));
        countdownEl.style.opacity = 0;
        await new Promise(r => setTimeout(r, 300));
      }
    }

    // === ターン開始 ===
    function startTurn() {
      inputArea.style.display = "flex";
      turnArea.style.display = "none";
      storyInput.value = "";
      updateCharCount();
      resetTimer();
    }

    // === 文字数カウント ===
    storyInput.addEventListener("input", updateCharCount);
    function updateCharCount() {
      charCount.textContent = storyInput.value.length + " / 35";
    }

    // === 決定ボタン ===
    submitBtn.addEventListener("click", () => {
      const text = storyInput.value.trim();
      if (!text) return;

      currentStory += text + " ";
      saveToFirebase(currentStory);

      inputArea.style.display = "none";
      turnArea.style.display = "flex";
    });

    // === 次のターン ===
    nextTurnBtn.addEventListener("click", () => {
      currentPlayer++;
      if (currentPlayer > totalPlayers) {
        alert("全員終了しました！");
        return;
      }
      startTurn();
    });

    // === タイマー ===
    function resetTimer() {
      clearInterval(timer);
      timeLeft = 30;
      timerEl.innerText = "制限時間: " + timeLeft;
      timer = setInterval(() => {
        timeLeft--;
        timerEl.innerText = "制限時間: " + timeLeft;
        if (timeLeft <= 0) {
          clearInterval(timer);
          submitBtn.click(); // 時間切れで自動決定
        }
      }, 1000);
    }

    // === Firebaseに保存 ===
    function saveToFirebase(storyText) {
      const today = new Date().toISOString().split("T")[0];
      const refPath = `まとめくくり/${today}/${totalPlayers}人目くくり/${currentPlayer}`;
      db.ref(refPath).set({
        text: storyText,
        player: currentPlayer,
        timestamp: Date.now()
      });
    }
  </script>
</body>
</html>
