<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>先生ページ</title>
  <style>
:root{
  --bg:#0b1022;
  --fg:#e5e7eb;
  --accent:#60a5fa;
  --accent-2:#34d399;
  --danger:#ef4444;
  --muted:#94a3b8;
}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 800px at 20% 10%, #142048 0%, transparent 60%),
    radial-gradient(1000px 700px at 80% 90%, #2b1645 0%, transparent 55%),
    linear-gradient(160deg, #0b1022 0%, #121b3a 100%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  text-align:center;overflow:hidden;padding:16px;
  animation:bgFloat 16s ease-in-out infinite alternate;
}
@keyframes bgFloat{
  0%{background-position:0 0,0 0,0 0; filter:hue-rotate(0deg)}
  100%{background-position:10px -14px,-12px 18px,0 0; filter:hue-rotate(10deg)}
}
 h1{margin:0 0 4px;font-size:1.4rem;color:var(--muted);font-weight:600}

.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

input,textarea,button{font:inherit;border:none;border-radius:12px;outline:none}
input,textarea{
  background:rgba(6,10,24,.8);color:var(--fg);padding:12px 14px;min-width:260px;
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(3px)
}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,.2)}
textarea{width:min(90vw,520px);height:92px;resize:none}

.btn{
  padding:12px 22px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#75b6ff,#3b82f6);color:#0b1220;
  box-shadow:0 10px 28px rgba(0,0,0,.4), inset 0 0 0 0 rgba(255,255,255,.35);
  transition:transform .08s ease,filter .2s ease,box-shadow .2s ease;
  position:relative;overflow:hidden
}
.btn::after{
  content:"";position:absolute;inset:auto -30% 0 -30%;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  transform:translateY(6px);filter:blur(2px);opacity:.0;transition:opacity .2s ease, transform .2s ease
}
.btn:hover{filter:brightness(1.05);box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:hover::after{opacity:.9;transform:translateY(0)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(180deg,#ff7474,#ef4444);color:#fff}

.hidden{display:none}

/* セクション入退場 */
.section-enter{animation:sectionIn .55s cubic-bezier(.2,.8,.2,1) both}
.section-exit{animation:sectionOut .35s ease both}
@keyframes sectionIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sectionOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}

/* カウントダウンの全画面演出 */
#overlay{
  position:fixed;inset:0;background:rgba(5,8,18,.85);
  display:none;align-items:center;justify-content:center;z-index:10;
  overflow:hidden
}
#overlay.show{display:flex}
#countNum{
  position:relative;
  font-size:min(16vw,160px);font-weight:1000;letter-spacing:.02em;line-height:1;
  color:#eaf2ff;-webkit-text-stroke:6px rgba(255,255,255,.12);
  text-shadow: 0 0 22px rgba(96,165,250,.5), 0 0 48px rgba(59,130,246,.35);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
  animation:pop .9s ease forwards, wobble .9s ease forwards;
}
@keyframes wobble{0%{transform:translateZ(0)}40%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}100%{transform:rotate(0)}}
#countNum::before, #countNum::after{
  content:"";position:absolute;inset:-40px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(96,165,250,.45),transparent 60%);
  animation:pulse 1s ease infinite
}
#countNum::after{
  inset:-70px;background:radial-gradient(circle at 50% 50%,rgba(250,204,21,.45),transparent 60%);
  mix-blend-mode:screen;animation:pulse2 1s ease infinite
}
@keyframes pulse{from{transform:scale(.7);opacity:.8}to{transform:scale(1.15);opacity:.0}}
@keyframes pulse2{from{transform:scale(.9);opacity:.6}to{transform:scale(1.3);opacity:.0}}
.startGlow{
  color:#ffd76a;-webkit-text-stroke:0 transparent;
  text-shadow:0 0 28px #ffd76a, 0 0 64px #ffb300, 0 0 96px #ff9900;
  animation:pop 1s ease forwards, blink 1s ease infinite alternate
}
@keyframes blink{from{opacity:1}to{opacity:.65}}

/* コンフェッティ風スパーク */
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:currentColor;filter:blur(.2px) drop-shadow(0 0 6px currentColor);
  animation:shoot 900ms ease-out forwards
}
@keyframes shoot{
  0%{transform:translate(0,0) scale(1);opacity:1}
  90%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.8);opacity:0}
}

/* タイマー（30s） */
#timerWrap{width:min(92vw,520px);height:16px;background:#1f2937;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#34d399,#60a5fa);transition:width 1s linear}

/* ステータス */
#status{min-height:1.2em;color:var(--muted);font-size:.95rem}
    /* === 履歴パネル === */
#history{
  position: fixed; right: 16px; bottom: 16px;
  width: 320px; max-height: 46vh;
  background: rgba(6,10,24,.85); color: var(--fg);
  border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
  backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,.4);
  display: flex; flex-direction: column; overflow: hidden; z-index: 20;
}
#historyHeader{
  display:flex; align-items:center; justify-content:space-between;
  padding: 8px 12px; font-weight: 700; background: rgba(255,255,255,.04);
}
#historyBody{ display:flex; flex-direction:column; gap:8px; padding:10px 12px; }
#storyTotal{
  font-size:.92rem; line-height:1.45; background: rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08); border-radius: 10px; padding:8px 10px; max-height: 90px; overflow:auto;
}
#historyList{ list-style:none; margin:0; padding:0; max-height: 160px; overflow:auto; }
.histItem{ font-size:.9rem; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08); }
.histMeta{ color: var(--muted); font-size:.82rem; }
#histToggle{ all:unset; cursor:pointer; padding:6px 8px; border-radius:8px; }
#histToggle:hover{ background: rgba(255,255,255,.08); }
.collapsed #historyBody{ display:none; }

  </style>
</head>
<body>
  <h1>ストーリーリレー（先生）</h1>
  <div id="status">準備中…</div>

  <!-- セットアップ：参加人数のみ（出席番号は各ターンごと） -->
  <section id="setup" class="stack">
    <div class="row">
      <input id="totalPlayers" type="number" min="1" inputmode="numeric" placeholder="参加人数を入力（例: 5）" />
    </div>
    <button id="btnStart" class="btn">スタート</button>
  </section>

  <!-- カウントダウン演出 -->
  <div id="overlay">
    <div id="countNum">3</div>
  </div>

  <!-- 各ターン：出席番号を先に -->
  <section id="seat" class="stack hidden">
    <div id="turnInfo">現在: 1人目 / - 人</div>
    <div class="row">
      <input id="seatNumber" type="number" inputmode="numeric" min="1" placeholder="出席番号を入力" />
    </div>
    <button id="btnSeatOk" class="btn">次へ</button>
  </section>

  <!-- 入力エリア（35文字・残数表示・30秒タイマー） -->
  <section id="input" class="stack hidden">
    <div id="remain">残り 35 文字</div>
    <textarea id="story" maxlength="35" placeholder="ここに入力（最大35文字）"></textarea>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <button id="btnDecide" class="btn">決定</button>
  </section>

  <!-- 交代エリア -->
  <section id="switch" class="stack hidden">
    <div style="font-size:1.1rem">次の人に代わってね！</div>
    <button id="btnSwitched" class="btn-ghost">代わった</button>
  </section>

  <!-- BGM（ループ） -->
  <audio id="bgm" src="assets/game_bgm.mp3" loop preload="auto"></audio>

  <!-- Firebase v8（バンドル・互換API） -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ===== Firebase 設定（リージョンURLは europe-west1 を使用）=====
    const firebaseConfig = {
      apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
      authDomain: "story-relay-ec15b.firebaseapp.com",
      databaseURL: "https://story-relay-ec15b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "story-relay-ec15b",
      storageBucket: "story-relay-ec15b.appspot.com",
      messagingSenderId: "423778345800",
      appId: "1:423778345800:web:d72d3569869bc3a789c97d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ===== DOM =====
    // 履歴パネル
const elHistory   = document.getElementById('history');
const elHistToggle= document.getElementById('histToggle');
const elHistoryList = document.getElementById('historyList');
const elStoryTotal  = document.getElementById('storyTotal');

    const elStatus = document.getElementById('status');
    const elSetup  = document.getElementById('setup');
    const elStart  = document.getElementById('btnStart');
    const elTotal  = document.getElementById('totalPlayers');

    const elOverlay = document.getElementById('overlay');
    const elCount   = document.getElementById('countNum');

    const elSeat   = document.getElementById('seat');
    const elTurn   = document.getElementById('turnInfo');
    const elSeatNo = document.getElementById('seatNumber');
    const elSeatOk = document.getElementById('btnSeatOk');

    const elInput   = document.getElementById('input');
    const elRemain  = document.getElementById('remain');
    const elStory   = document.getElementById('story');
    const elTimerBar= document.getElementById('timerBar');
    const elDecide  = document.getElementById('btnDecide');

    const elSwitch  = document.getElementById('switch');
    const elSwitched= document.getElementById('btnSwitched');

    const bgm = document.getElementById('bgm');

    // ===== 状態 =====
    const LIMIT = 30;  // 秒
    let totalPlayers = 0;
    let currentTurn  = 1;
    let currentSeat  = '';
    let timerId      = null;
    let totalStoryText = "";        // 連結した全文
let historyRef = null;          // DBリスナー参照


    const today = new Date().toISOString().split('T')[0]; // 例: 2025-08-19
    let basePath = ''; // まとめくくり/<date>/<N>人まとめ

    // ===== 匿名ログイン（セッション永続化でトラッキング防止の影響を緩和） =====
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .catch(e => console.warn('setPersistence failed:', e))
      .finally(ensureAnonSignIn);

    async function ensureAnonSignIn(){
      try{
        if(!auth.currentUser){
          await auth.signInAnonymously();
          elStatus.textContent = '匿名ログイン完了';
        }else{
          elStatus.textContent = 'ログイン済み';
        }
      }catch(e){
        console.error(e);
        const map = {
          'auth/operation-not-allowed':'匿名ログインが無効です（Auth→ログイン方法→匿名を有効化）',
          'auth/unauthorized-domain':'このドメインが承認されていません（Auth→承認済みドメインに追加）'
        };
        elStatus.textContent = map[e.code] || ('ログイン失敗: ' + (e.code||e.message));
      }
    }

    // ===== UI ユーティリティ（アニメ付き表示/非表示） =====
    function show(el){
      if(el.id === 'overlay'){
        el.classList.add('show');
      }else{
        el.classList.remove('hidden');
        el.classList.remove('section-exit');
        void el.offsetWidth; // reflow
        el.classList.add('section-enter');
      }
    }
    function hide(el){
      if(el.id === 'overlay'){
        el.classList.remove('show');
      }else{
        el.classList.remove('section-enter');
        el.classList.add('section-exit');
        setTimeout(()=> el.classList.add('hidden'), 320);
      }
    }
    // 待機
    function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

    // コンフェッティ風スパーク
    function burstSparks(n){
      let layer = document.querySelector('.sparks');
      if(!layer){ layer = document.createElement('div'); layer.className='sparks'; elOverlay.appendChild(layer); }
      const palette = ['#60a5fa','#93c5fd','#facc15','#fb923c','#34d399'];
      for(let i=0;i<n;i++){
        const s = document.createElement('div');
        s.className='spark'; s.style.color = palette[i%palette.length];
        const angle = Math.random()*Math.PI*2;
        const dist  = 160 + Math.random()*160;
        s.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        s.style.setProperty('--dy', Math.sin(angle)*dist+'px');
        s.style.left='50%'; s.style.top='50%'; s.style.transform='translate(-50%,-50%)';
        layer.appendChild(s);
        setTimeout(()=> s.remove(), 950);
      }
    }

    // ===== スタート押下：人数チェック→321→BGM→出席番号入力へ =====
    elStart.addEventListener('click', async ()=>{
      totalPlayers = parseInt(elTotal.value,10);
      if(!totalPlayers || totalPlayers < 1){ alert('参加人数を入力してください'); return; }

      // ベースパス決定 & メタ保存（参加人数はまとめに一度だけ）
      basePath = `まとめくくり/${today}/${totalPlayers}人まとめ`;
      firebase.database().ref(`${basePath}/_meta`).update({
        参加人数: totalPlayers,
        開始時刻: Date.now()
      }).catch(console.warn);

      hide(elSetup);
      await runCountdown();

      // ユーザー操作後なので BGM 再生が通りやすい
      bgm.volume = 0; // フェードイン
      bgm.play().then(()=>{
        const fade = setInterval(()=>{
          bgm.volume = Math.min(1, bgm.volume + 0.1);
          if(bgm.volume >= 1) clearInterval(fade);
        }, 60);
      }).catch(err=>console.warn('BGM再生に失敗:', err));
      // 履歴リスナー（このセッションのルートに張る）
if(historyRef){ historyRef.off(); }
historyRef = firebase.database().ref(basePath);
historyRef.on('child_added', snap => {
  const key = snap.key;
  if(key === '_meta') return; // メタは除外
  const v = snap.val() || {};
  const when = new Date(v.タイムスタンプ || Date.now());

  // 連結テキスト更新
  if (v.文字) {
    totalStoryText = (totalStoryText + " " + v.文字).trim();
    elStoryTotal.textContent = totalStoryText;
  }

  // 履歴アイテムを先頭に追加（新しい順）
  const li = document.createElement('li');
  li.className = 'histItem';
  li.innerHTML = `
    <div><strong>${escapeHtml(v.文字 || '')}</strong></div>
    <div class="histMeta">
      ${fmtDate(when)}／出席番号: ${escapeHtml(v.出席番号 || '-')}／${escapeHtml(key)}
    </div>
  `;
  // 先頭に挿入
  elHistoryList.insertBefore(li, elHistoryList.firstChild);
});

      // 1人目の出席番号入力へ
      currentTurn = 1;
      elTurn.textContent = `現在: ${currentTurn}人目 / 全 ${totalPlayers}人`;
      elSeatNo.value = '';
      show(elSeat);
      elSeatNo.focus();
    });

    // ===== カウントダウン演出 =====
    async function runCountdown(){
      const seq = ['3','2','1','スタート!'];
      show(elOverlay);
      for(let i=0;i<seq.length;i++){
        elCount.className = (i === seq.length-1) ? 'startGlow' : '';
        elCount.textContent = seq[i];
        if(i === seq.length-1) burstSparks(28); else burstSparks(10);
        void elCount.offsetWidth; // reflow してアニメ確実化
        await wait(900);
      }
      hide(elOverlay);
    }

    // ===== 出席番号 → 入力画面へ =====
    elSeatOk.addEventListener('click', ()=>{
      const v = (elSeatNo.value||'').trim();
      if(!v){ alert('出席番号を入力してください'); elSeatNo.focus(); return; }
      currentSeat = v;
      // 入力開始へ
      hide(elSeat);
      elStory.value = '';
      updateRemain();
      show(elInput);
      startTimer();
      elStory.focus();
    });

    // ===== 入力文字数 残数表示 =====
    function updateRemain(){
      const left = 35 - (elStory.value||'').length;
      elRemain.textContent = `残り ${left} 文字`;
    }
    elStory.addEventListener('input', updateRemain);

    // ===== 30秒タイマー =====
    function startTimer(){
      clearInterval(timerId);
      let t = LIMIT;
      elTimerBar.style.width = '100%';
      timerId = setInterval(()=>{
        t--;
        elTimerBar.style.width = (t/LIMIT*100)+'%';
        if(t<=0){
          clearInterval(timerId);
          handleDecide(); // 時間切れは自動決定
        }
      },1000);
    }

    // ===== 決定：保存 → 交代表示 =====
    elDecide.addEventListener('click', handleDecide);
    function handleDecide(){
      clearInterval(timerId);
      const text = (elStory.value||'').trim();
      // 空文字は保存しない（必要ならこの if を外す）
      if(text){
        const path = `${basePath}/${currentTurn}人目くくり`;
        firebase.database().ref(path).set({
          出席番号: currentSeat,
          文字: text,
          タイムスタンプ: Date.now()
        }).catch(e=>{
          console.error(e);
          elStatus.textContent = '保存に失敗: ' + (e.code||e.message);
        });
        // 即時ローカル反映（child_added を待たない）
if (text) {
  totalStoryText = (totalStoryText + " " + text).trim();
  elStoryTotal.textContent = totalStoryText;
}

      }
      hide(elInput);
      show(elSwitch);
    }

    // ===== 代わった → 次の人：また出席番号 → 入力 =====
    elSwitched.addEventListener('click', ()=>{
      hide(elSwitch);
      currentTurn++;
      if(currentTurn > totalPlayers){
        elStatus.textContent = '全員終了しました。おつかれさま！';
        return;
      }
      elTurn.textContent = `現在: ${currentTurn}人目 / 全 ${totalPlayers}人`;
      elSeatNo.value = '';
      show(elSeat);
      elSeatNo.focus();
    });
    function fmtDate(d){
  // 例: 2025-08-19 15:04:05
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'    // ←ここを修正
  }[m]));
}

// パネル開閉
elHistToggle.addEventListener('click', ()=>{
  elHistory.classList.toggle('collapsed');
  elHistToggle.textContent = elHistory.classList.contains('collapsed') ? '△' : '▽';
});
                                             <aside id="history" class="">
  <div id="historyHeader">
    <span>📜 履歴</span>
    <button id="histToggle" aria-label="toggle">▽</button>
  </div>
  <div id="historyBody">
    <div>
      <div class="histMeta">これまでのストーリー（連結）</div>
      <div id="storyTotal"></div>
    </div>
    <ul id="historyList"></ul>
  </div>
</aside>

  </script>



</body>
</html>
