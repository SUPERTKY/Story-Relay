<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Teacher Page</title>
  <style>
    body {
      height: 100%;
      margin: 0;
      background: #111827;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      font-family: sans-serif;
    }

    #startBtn, #decideBtn, #switchBtn, #goBtn {
      padding: 12px 24px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    #inputArea {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    #storyInput {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      font-size: 1rem;
    }

    #charCount {
      margin-top: 4px;
      font-size: 0.9rem;
      color: #ddd;
    }

    #switchArea, #goArea {
      display: none;
      flex-direction: column;
      align-items: center;
      margin-top: 20px;
    }

    #timerBar {
      width: 80%;
      height: 20px;
      background: #444;
      margin-top: 20px;
      border-radius: 10px;
      overflow: hidden;
    }
    #timerProgress {
      height: 100%;
      width: 100%;
      background: #34d399;
      transition: width 1s linear;
    }
  </style>
</head>
<body>
  <button id="startBtn">スタート</button>
  <div id="countdown"></div>

  <div id="inputArea">
    <textarea id="storyInput" maxlength="35" placeholder="ここに入力 (最大35文字)"></textarea>
    <div id="charCount">残り 35 文字</div>
    <button id="decideBtn">決定</button>
  </div>

  <div id="switchArea">
    <p>次の人に代わってね！</p>
    <button id="switchBtn">代わった</button>
  </div>

  <div id="goArea">
    <p>次の人、準備OK？</p>
    <button id="goBtn">どうぞ！</button>
  </div>

  <div id="timerBar" style="display:none;">
    <div id="timerProgress"></div>
  </div>

  <audio id="bgm" src="assets/game_bgm.mp3" loop></audio>

  <!-- ✅ Firebaseバンドル版 (名前空間あり) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ✅ Firebase設定
    const firebaseConfig = {
      apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
      authDomain: "story-relay-ec15b.firebaseapp.com",
      databaseURL: "https://story-relay-ec15b-default-rtdb.firebaseio.com/",
      projectId: "story-relay-ec15b",
      storageBucket: "story-relay-ec15b.appspot.com",
      messagingSenderId: "423778345800",
      appId: "1:423778345800:web:d72d3569869bc3a789c97d"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // DOM取得
    const startBtn = document.getElementById("startBtn");
    const countdown = document.getElementById("countdown");
    const bgm = document.getElementById("bgm");
    const inputArea = document.getElementById("inputArea");
    const storyInput = document.getElementById("storyInput");
    const charCount = document.getElementById("charCount");
    const decideBtn = document.getElementById("decideBtn");
    const switchArea = document.getElementById("switchArea");
    const switchBtn = document.getElementById("switchBtn");
    const goArea = document.getElementById("goArea");
    const goBtn = document.getElementById("goBtn");
    const timerBar = document.getElementById("timerBar");
    const timerProgress = document.getElementById("timerProgress");

    let timerInterval;
    const LIMIT = 30; // 秒

    // 文字数カウント
    storyInput.addEventListener("input", () => {
      const remain = 35 - storyInput.value.length;
      charCount.textContent = `残り ${remain} 文字`;
    });

    startBtn.addEventListener("click", async () => {
      startBtn.style.display = "none";
      await runCountdown();
      bgm.play();
      startTurn();
    });

    async function runCountdown() {
      countdown.style.fontSize = "6rem";
      const seq = ["3", "2", "1", "スタート!"];
      for (let i=0; i<seq.length; i++) {
        countdown.textContent = seq[i];
        await wait(1000);
      }
      countdown.textContent = "";
    }

    function startTurn() {
      inputArea.style.display = "flex";
      switchArea.style.display = "none";
      goArea.style.display = "none";
      storyInput.value = "";
      charCount.textContent = "残り 35 文字";
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timerBar.style.display = "block";
      let timeLeft = LIMIT;
      timerProgress.style.width = "100%";

      timerInterval = setInterval(() => {
        timeLeft--;
        const percent = (timeLeft / LIMIT) * 100;
        timerProgress.style.width = percent + "%";
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          decideAction();
        }
      }, 1000);
    }

    decideBtn.addEventListener("click", decideAction);

    function decideAction() {
      clearInterval(timerInterval);
      timerBar.style.display = "none";

      const text = storyInput.value.trim();
      if (text.length > 0) {
        // Firebaseに追加保存
        db.ref("story").push(text);
      }

      inputArea.style.display = "none";
      switchArea.style.display = "flex";
    }

    switchBtn.addEventListener("click", () => {
      switchArea.style.display = "none";
      goArea.style.display = "flex";
    });

    goBtn.addEventListener("click", () => {
      goArea.style.display = "none";
      startTurn(); // 次のターン
    });

    function wait(ms) {
      return new Promise(res => setTimeout(res, ms));
    }
  </script>
</body>
</html>
