<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>先生ページ</title>
  <style>
:root{
  --bg:#0b1022;
  --fg:#e5e7eb;
  --accent:#60a5fa;
  --accent-2:#34d399;
  --danger:#ef4444;
  --muted:#94a3b8;
}
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 800px at 20% 10%, #142048 0%, transparent 60%),
    radial-gradient(1000px 700px at 80% 90%, #2b1645 0%, transparent 55%),
    linear-gradient(160deg, #0b1022 0%, #121b3a 100%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  text-align:center;overflow:hidden;padding:16px;
  animation:bgFloat 16s ease-in-out infinite alternate;
}
@keyframes bgFloat{
  0%{background-position:0 0,0 0,0 0; filter:hue-rotate(0deg)}
  100%{background-position:10px -14px,-12px 18px,0 0; filter:hue-rotate(10deg)}
}
h1{margin:0 0 4px;font-size:1.4rem;color:var(--muted);font-weight:600}

.stack{display:flex;flex-direction:column;align-items:center;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

input,textarea,button{font:inherit;border:none;border-radius:12px;outline:none}
input,textarea{
  background:rgba(6,10,24,.8);color:var(--fg);padding:12px 14px;min-width:260px;
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(3px)
}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,.2)}
textarea{width:min(90vw,520px);height:92px;resize:none}

.btn{
  padding:12px 22px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#75b6ff,#3b82f6);color:#0b1220;
  box-shadow:0 10px 28px rgba(0,0,0,.4), inset 0 0 0 0 rgba(255,255,255,.35);
  transition:transform .08s ease,filter .2s ease,box-shadow .2s ease;
  position:relative;overflow:hidden
}
.btn::after{
  content:"";position:absolute;inset:auto -30% 0 -30%;height:3px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);
  transform:translateY(6px);filter:blur(2px);opacity:.0;transition:opacity .2s ease, transform .2s ease
}
.btn:hover{filter:brightness(1.05);box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.25)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:hover::after{opacity:.9;transform:translateY(0)}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.2)}
.btn-danger{background:linear-gradient(180deg,#ff7474,#ef4444);color:#fff}

.hidden{display:none}

/* セクション入退場 */
.section-enter{animation:sectionIn .55s cubic-bezier(.2,.8,.2,1) both}
.section-exit{animation:sectionOut .35s ease both}
@keyframes sectionIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes sectionOut{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-12px)}}

/* カウントダウンの全画面演出 */
#overlay{
  position:fixed;inset:0;background:rgba(5,8,18,.85);
  display:none;align-items:center;justify-content:center;z-index:10;
  overflow:hidden
}
#overlay.show{display:flex}
#countNum{
  position:relative;
  font-size:min(16vw,160px);font-weight:1000;letter-spacing:.02em;line-height:1;
  color:#eaf2ff;-webkit-text-stroke:6px rgba(255,255,255,.12);
  text-shadow: 0 0 22px rgba(96,165,250,.5), 0 0 48px rgba(59,130,246,.35);
  filter:drop-shadow(0 10px 30px rgba(0,0,0,.6));
  animation:pop .9s ease forwards, wobble .9s ease forwards;
}
@keyframes wobble{0%{transform:translateZ(0)}40%{transform:rotate(-2deg)}75%{transform:rotate(1deg)}100%{transform:rotate(0)}}
#countNum::before, #countNum::after{
  content:"";position:absolute;inset:-40px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,rgba(96,165,250,.45),transparent 60%);
  animation:pulse 1s ease infinite
}
#countNum::after{
  inset:-70px;background:radial-gradient(circle at 50% 50%,rgba(250,204,21,.45),transparent 60%);
  mix-blend-mode:screen;animation:pulse2 1s ease infinite
}
@keyframes pulse{from{transform:scale(.7);opacity:.8}to{transform:scale(1.15);opacity:.0}}
@keyframes pulse2{from{transform:scale(.9);opacity:.6}to{transform:scale(1.3);opacity:.0}}
.startGlow{
  color:#ffd76a;-webkit-text-stroke:0 transparent;
  text-shadow:0 0 28px #ffd76a, 0 0 64px #ffb300, 0 0 96px #ff9900;
  animation:pop 1s ease forwards, blink 1s ease infinite alternate
}
@keyframes blink{from{opacity:1}to{opacity:.65}}

/* コンフェッティ風スパーク */
.sparks{position:absolute;inset:0;pointer-events:none}
.spark{
  position:absolute;width:6px;height:6px;border-radius:50%;
  background:currentColor;filter:blur(.2px) drop-shadow(0 0 6px currentColor);
  animation:shoot 900ms ease-out forwards
}
@keyframes shoot{
  0%{transform:translate(0,0) scale(1);opacity:1}
  90%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) scale(.8);opacity:0}
}

/* タイマー（30s） */
#timerWrap{width:min(92vw,520px);height:16px;background:#1f2937;border-radius:999px;overflow:hidden;box-shadow:inset 0 2px 6px rgba(0,0,0,.4)}
#timerBar{height:100%;width:100%;background:linear-gradient(90deg,#22c55e,#34d399,#60a5fa);transition:width 1s linear}

/* ステータス */
#status{min-height:1.2em;color:var(--muted);font-size:.95rem}

/* === 右下・履歴パネル === */
#history{
  position: fixed; right: 16px; bottom: 16px;
  width: 320px; max-height: 46vh;
  background: rgba(6,10,24,.85); color: var(--fg);
  border: 1px solid rgba(255,255,255,.12); border-radius: 14px;
  backdrop-filter: blur(6px); box-shadow: 0 10px 30px rgba(0,0,0,.4);
  display: flex; flex-direction: column; overflow: hidden; z-index: 20;
}
#historyHeader{display:flex; align-items:center; justify-content:space-between; padding: 8px 12px; font-weight: 700; background: rgba(255,255,255,.04)}
#historyBody{ display:flex; flex-direction:column; gap:8px; padding:10px 12px; }
#storyTotal{font-size:.92rem; line-height:1.45; background: rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.08); border-radius: 10px; padding:8px 10px; max-height: 90px; overflow:auto}
#historyList{ list-style:none; margin:0; padding:0; max-height: 160px; overflow:auto }
.histItem{ font-size:.9rem; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.08) }
.histMeta{ color: var(--muted); font-size:.82rem }
#histToggle{ all:unset; cursor:pointer; padding:6px 8px; border-radius:8px }
#histToggle:hover{ background: rgba(255,255,255,.08) }
.collapsed #historyBody{ display:none }

/* === 履歴モーダル === */
#historyModal{position:fixed; inset:0; display:none; z-index:50; background:rgba(0,0,0,.6); align-items:center; justify-content:center}
#historyModal.show{display:flex}
#historyCard{width:min(92vw,900px); max-height:80vh; overflow:auto; background:#0b1022; color:#e5e7eb; border:1px solid rgba(255,255,255,.12); border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.6); padding:16px 18px}
#historyToolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
#historyDate{background:#0f172a; color:#e5e7eb; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 10px}
#sessionSelect{background:#0f172a; color:#e5e7eb; border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:8px 10px}
#modalList{list-style:none; padding:0; margin:10px 0; display:flex; flex-direction:column; gap:10px}
.modalItem{padding:10px; border:1px solid rgba(255,255,255,.08); border-radius:10px; background:rgba(255,255,255,.04)}
.modalMeta{color:#94a3b8; font-size:.9rem; margin-top:4px}
#modalStoryConcat{white-space:pre-wrap; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:10px; padding:10px; max-height:160px; overflow:auto}
    /* === 左下：生徒メッセージ受信パネル === */
#supportPanel{
  position:fixed; left:16px; bottom:16px; width:340px; max-height:46vh;
  background:rgba(6,10,24,.85); border:1px solid rgba(255,255,255,.12); border-radius:14px;
  backdrop-filter:blur(6px); box-shadow:0 10px 30px rgba(0,0,0,.4); display:flex; flex-direction:column; z-index:20;
}
#supportHeader{display:flex; align-items:center; justify-content:space-between; padding:8px 12px; background:rgba(255,255,255,.04); font-weight:700}
#supportBody{display:flex; flex-direction:column; gap:8px; padding:10px 12px; overflow:auto}
.msgItem{border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.04); border-radius:10px; padding:8px}
.msgMeta{font-size:.8rem; color:var(--muted); margin-top:4px}
.badgeCount{display:inline-block; padding:2px 8px; border-radius:999px; background:rgba(96,165,250,.15); border:1px solid rgba(96,165,250,.4); color:#bfdbfe; font-size:.8rem}

  </style>
</head>
<body>
  <h1>ストーリーリレー（先生）</h1>
  <div id="status">準備中…</div>

  <!-- セットアップ：参加人数のみ（出席番号は各ターンごと） -->
  <section id="setup" class="stack">
    <div class="row">
      <input id="totalPlayers" type="number" min="1" inputmode="numeric" placeholder="参加人数を入力（例: 5）" />
    </div>
    <div class="row">
      <button id="btnStart" class="btn">スタート</button>
      <button id="btnOpenHistory" class="btn-ghost">履歴を見る</button>
    </div>
  </section>

  <!-- カウントダウン演出 -->
  <div id="overlay">
    <div id="countNum">3</div>
  </div>

  <!-- 各ターン：出席番号を先に -->
  <section id="seat" class="stack hidden">
    <div id="turnInfo">現在: 1人目 / - 人</div>
    <div class="row">
      <input id="seatNumber" type="number" inputmode="numeric" min="1" placeholder="出席番号を入力" />
    </div>
    <button id="btnSeatOk" class="btn">次へ</button>
  </section>

  <!-- 入力エリア（35文字・残数表示・30秒タイマー） -->
  <section id="input" class="stack hidden">
    <div id="remain">残り 35 文字</div>
    <textarea id="story" maxlength="35" placeholder="ここに入力（最大35文字）"></textarea>
    <div id="timerWrap"><div id="timerBar"></div></div>
    <button id="btnDecide" class="btn">決定</button>
  </section>

  <!-- 交代エリア -->
  <section id="switch" class="stack hidden">
    <div style="font-size:1.1rem">次の人に代わってね！</div>
    <button id="btnSwitched" class="btn-ghost">代わった</button>
  </section>

  <!-- 右下：履歴パネル -->
  <aside id="history" class="">
    <div id="historyHeader">
      <span>📜 履歴</span>
      <button id="histToggle" aria-label="toggle">▽</button>
    </div>
    <div id="historyBody">
      <div>
        <div class="histMeta">これまでのストーリー（連結）</div>
        <div id="storyTotal"></div>
      </div>
      <ul id="historyList"></ul>
    </div>
  </aside>

  <!-- 全画面履歴モーダル -->
  <div id="historyModal" aria-hidden="true">
    <div id="historyCard">
      <div id="historyToolbar">
        <strong style="margin-right:6px">履歴</strong>
        <input id="historyDate" type="date">
        <select id="sessionSelect" title="セッション（参加人数まとめ）"></select>
        <button id="btnReload" class="btn-ghost">読み込み</button>
        <span style="flex:1"></span>
        <button id="btnCopyAll" class="btn">全文コピー</button>
        <button id="btnExportCsv" class="btn">CSV</button>
        <button id="btnCloseHistory" class="btn-danger">閉じる</button>
      </div>

      <div class="histMeta">この日の連結ストーリー</div>
      <div id="modalStoryConcat"></div>

      <div style="margin-top:10px" class="histMeta">回答一覧（時系列）</div>
      <ul id="modalList"></ul>
    </div>
  </div>

  <!-- BGM（ループ） -->
  <audio id="bgm" src="assets/game_bgm.mp3" loop preload="auto"></audio>
  <!-- ★ 左下：生徒メッセージ受信パネル -->
<aside id="supportPanel" class="hidden">
  <div id="supportHeader">
    <span>💬 生徒メッセージ <span id="msgCount" class="badgeCount">0</span></span>
    <button id="btnClearView" class="btn-ghost" title="表示だけ消す">クリア</button>
  </div>
  <div id="supportBody"></div>
</aside>



  <!-- Firebase v8（バンドル・互換API） -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ===== Firebase 設定（リージョンURLは europe-west1 を使用）=====
    const firebaseConfig = {
      apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
      authDomain: "story-relay-ec15b.firebaseapp.com",
      databaseURL: "https://story-relay-ec15b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "story-relay-ec15b",
      storageBucket: "story-relay-ec15b.appspot.com",
      messagingSenderId: "423778345800",
      appId: "1:423778345800:web:d72d3569869bc3a789c97d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // ===== DOM =====
    const elStatus = document.getElementById('status');
    const elSetup  = document.getElementById('setup');
    const elStart  = document.getElementById('btnStart');
    const elTotal  = document.getElementById('totalPlayers');

    const elOverlay = document.getElementById('overlay');
    const elCount   = document.getElementById('countNum');

    const elSeat   = document.getElementById('seat');
    const elTurn   = document.getElementById('turnInfo');
    const elSeatNo = document.getElementById('seatNumber');
    const elSeatOk = document.getElementById('btnSeatOk');

    const elInput   = document.getElementById('input');
    const elRemain  = document.getElementById('remain');
    const elStory   = document.getElementById('story');
    const elTimerBar= document.getElementById('timerBar');
    const elDecide  = document.getElementById('btnDecide');

    const elSwitch  = document.getElementById('switch');
    const elSwitched= document.getElementById('btnSwitched');

    // 右下履歴
    const elHistory   = document.getElementById('history');
    const elHistToggle= document.getElementById('histToggle');
    const elHistoryList = document.getElementById('historyList');
    const elStoryTotal  = document.getElementById('storyTotal');

    // 履歴モーダル
    const btnOpenHistory   = document.getElementById('btnOpenHistory');
    const historyModal     = document.getElementById('historyModal');
    const btnCloseHistory  = document.getElementById('btnCloseHistory');
    const historyDateInput = document.getElementById('historyDate');
    const sessionSelect    = document.getElementById('sessionSelect');
    const btnReload        = document.getElementById('btnReload');
    const modalStoryConcat = document.getElementById('modalStoryConcat');
    const modalList        = document.getElementById('modalList');
    const btnCopyAll       = document.getElementById('btnCopyAll');
    const btnExportCsv     = document.getElementById('btnExportCsv');

    const bgm = document.getElementById('bgm');
    // ★ 生徒メッセージUI
const elSupportPanel = document.getElementById('supportPanel');
const elSupportBody  = document.getElementById('supportBody');
const elMsgCount     = document.getElementById('msgCount');
const elBtnClearView = document.getElementById('btnClearView');
  

    // ===== 状態 =====
    const LIMIT = 30;  // 秒
    let totalPlayers = 0;
    let currentTurn  = 1;
    let currentSeat  = '';
    let timerId      = null;
    let totalStoryText = "";        // 連結した全文（右下）
    let historyRef = null;           // DBリスナー参照
  // サポート購読に使う状態
let supportRef = null;
let supportListenerOn = false;

    const today = new Date().toISOString().split('T')[0]; // 例: 2025-08-19
    let basePath = ''; // まとめくくり/<date>/<N>人まとめ

    // ===== 匿名ログイン（セッション永続化でトラッキング防止の影響を緩和） =====
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .catch(e => console.warn('setPersistence failed:', e))
      .finally(ensureAnonSignIn);

    async function ensureAnonSignIn(){
      try{
        if(!auth.currentUser){
          await auth.signInAnonymously();
          elStatus.textContent = '匿名ログイン完了';
        }else{
          elStatus.textContent = 'ログイン済み';
        }
      }catch(e){
        console.error(e);
        const map = {
          'auth/operation-not-allowed':'匿名ログインが無効です（Auth→ログイン方法→匿名を有効化）',
          'auth/unauthorized-domain':'このドメインが承認されていません（Auth→承認済みドメインに追加）'
        };
        elStatus.textContent = map[e.code] || ('ログイン失敗: ' + (e.code||e.message));
      }
    }

    // ===== UI ユーティリティ（アニメ付き表示/非表示） =====
    function show(el){
      if(el.id === 'overlay'){
        el.classList.add('show');
      }else{
        el.classList.remove('hidden');
        el.classList.remove('section-exit');
        void el.offsetWidth; // reflow
        el.classList.add('section-enter');
      }
    }
    function hide(el){
      if(el.id === 'overlay'){
        el.classList.remove('show');
      }else{
        el.classList.remove('section-enter');
        el.classList.add('section-exit');
        setTimeout(()=> el.classList.add('hidden'), 320);
      }
    }
    function wait(ms){ return new Promise(r=>setTimeout(r,ms)); }

    // コンフェッティ風スパーク
    function burstSparks(n){
      let layer = document.querySelector('.sparks');
      if(!layer){ layer = document.createElement('div'); layer.className='sparks'; elOverlay.appendChild(layer); }
      const palette = ['#60a5fa','#93c5fd','#facc15','#fb923c','#34d399'];
      for(let i=0;i<n;i++){
        const s = document.createElement('div');
        s.className='spark'; s.style.color = palette[i%palette.length];
        const angle = Math.random()*Math.PI*2;
        const dist  = 160 + Math.random()*160;
        s.style.setProperty('--dx', Math.cos(angle)*dist+'px');
        s.style.setProperty('--dy', Math.sin(angle)*dist+'px');
        s.style.left='50%'; s.style.top='50%'; s.style.transform='translate(-50%,-50%)';
        layer.appendChild(s);
        setTimeout(()=> s.remove(), 950);
      }
    }

    // ===== スタート押下：人数チェック→321→BGM→出席番号入力へ =====
    elStart.addEventListener('click', async ()=>{
      totalPlayers = parseInt(elTotal.value,10);
      if(!totalPlayers || totalPlayers < 1){ alert('参加人数を入力してください'); return; }

      // ベースパス決定 & メタ保存（参加人数はまとめに一度だけ）
      basePath = `まとめくくり/${today}/${totalPlayers}人まとめ`;
      db.ref(`${basePath}/_meta`).update({ 参加人数: totalPlayers, 開始時刻: Date.now() }).catch(console.warn);

      // 右下履歴UIをリセット
      totalStoryText = '';
      elStoryTotal.textContent = '';
      elHistoryList.innerHTML = '';

      hide(elSetup);
      await runCountdown();

      // ユーザー操作後なので BGM 再生が通りやすい
      bgm.volume = 0; // フェードイン
      bgm.play().then(()=>{
        const fade = setInterval(()=>{
          bgm.volume = Math.min(1, bgm.volume + 0.1);
          if(bgm.volume >= 1) clearInterval(fade);
        }, 60);
      }).catch(err=>console.warn('BGM再生に失敗:', err));

      // 履歴リスナー（このセッションのルートに張る）
      if(historyRef){ historyRef.off(); }
      historyRef = db.ref(basePath);
      historyRef.on('child_added', snap => {
        const key = snap.key;
        if(key === '_meta') return; // メタは除外
        const v = snap.val() || {};
        const when = new Date(v.タイムスタンプ || Date.now());

        // 連結テキスト更新（右下）
        if (v.文字) {
          totalStoryText = (totalStoryText + " " + v.文字).trim();
          if (elStoryTotal) elStoryTotal.textContent = totalStoryText;
        }

        // 履歴アイテム（右下）
        if (elHistoryList) {
          const li = document.createElement('li');
          li.className = 'histItem';
          li.innerHTML = `
            <div><strong>${escapeHtml(v.文字 || '')}</strong></div>
            <div class="histMeta">${fmtDate(when)}／出席番号: ${escapeHtml(v.出席番号 || '-')}／${escapeHtml(key)}</div>
          `;
          elHistoryList.insertBefore(li, elHistoryList.firstChild);
        }
      });

      // 1人目の出席番号入力へ
      currentTurn = 1;
      elTurn.textContent = `現在: ${currentTurn}人目 / 全 ${totalPlayers}人`;
      elSeatNo.value = '';
      show(elSeat);
      elSeatNo.focus();
      attachSupportListener();
elSupportPanel.classList.remove('hidden');

    });

    // ===== カウントダウン演出 =====
    async function runCountdown(){
      const seq = ['3','2','1','スタート!'];
      show(elOverlay);
      for(let i=0;i<seq.length;i++){
        elCount.className = (i === seq.length-1) ? 'startGlow' : '';
        elCount.textContent = seq[i];
        if(i === seq.length-1) burstSparks(28); else burstSparks(10);
        void elCount.offsetWidth; // reflow してアニメ確実化
        await wait(900);
      }
      hide(elOverlay);
    }

    // ===== 出席番号 → 入力画面へ =====
<!-- teacher.html の該当JS内：elSeatOk.addEventListener('click', ... ) の末尾付近に追加 -->
elSeatOk.addEventListener('click', ()=>{
  const v = (elSeatNo.value||'').trim();
  if(!v){ alert('出席番号を入力してください'); elSeatNo.focus(); return; }
  currentSeat = v;

  // ★★★ ここを追加：このターンの公式な開始時刻（サーバー時刻）
  db.ref(`${basePath}/_meta`).update({
    ターン開始時刻: firebase.database.ServerValue.TIMESTAMP
  }).catch(console.warn);

  // 入力開始へ
  hide(elSeat);
  elStory.value = '';
  updateRemain();
  show(elInput);
  startTimer();
  elStory.focus();
});

    // ===== 入力文字数 残数表示 =====
    function updateRemain(){
      const left = 35 - (elStory.value||'').length;
      elRemain.textContent = `残り ${left} 文字`;
    }
    elStory.addEventListener('input', updateRemain);

    // ===== 30秒タイマー =====
    function startTimer(){
      clearInterval(timerId);
      let t = LIMIT;
      elTimerBar.style.width = '100%';
      timerId = setInterval(()=>{
        t--;
        elTimerBar.style.width = (t/LIMIT*100)+'%';
        if(t<=0){
          clearInterval(timerId);
          handleDecide(); // 時間切れは自動決定
        }
      },1000);
    }

    // ===== 決定：保存 → 交代表示（反映は child_added に任せる） =====
    elDecide.addEventListener('click', handleDecide);
    async function handleDecide() {
      clearInterval(timerId);

      const text = (elStory.value || '').trim();
      // 空文字でも交代だけ進めたい場合は if を外す
      if (text) {
        const path = `${basePath}/${currentTurn}`;
        try {
          await db.ref(path).set({ 出席番号: currentSeat, 文字: text, タイムスタンプ: Date.now() });
        } catch (e) {
          console.error(e);
          elStatus.textContent = '保存に失敗: ' + (e.code || e.message);
        }
      }
      hide(elInput);
      show(elSwitch);
    }

    // ===== 代わった → 次の人：また出席番号 → 入力 =====
elSwitched.addEventListener('click', async ()=>{
  // ★ いまのターンのサポート文を履歴へ保存＆/support クリア
  await archiveSupportForTurn(currentTurn);
  clearSupportView();

  hide(elSwitch);
  currentTurn++;
if(currentTurn > totalPlayers){
  // セッション終了フラグ（生徒端末はこれを見て未開催へ）
  db.ref(`${basePath}/_meta`).update({ 状態:'ended', 終了時刻: Date.now() }).catch(()=>{});
  elStatus.textContent = '全員終了しました。おつかれさま！';
  // 念のためサポート残りをアーカイブ & 監視解除
  await archiveSupportForTurn('終了時残り');
  detachSupportListener();
  return;
}

  elTurn.textContent = `現在: ${currentTurn}人目 / 全 ${totalPlayers}人`;
  elSeatNo.value = '';
  show(elSeat);
  elSeatNo.focus();
});


    // ===== 右下パネルの開閉 =====
    elHistToggle.addEventListener('click', ()=>{
      elHistory.classList.toggle('collapsed');
      elHistToggle.textContent = elHistory.classList.contains('collapsed') ? '△' : '▽';
    });

    // ===== 履歴モーダル：日付初期値（今日） =====
    (function initHistoryDate(){
      const tz = new Date();
      const yyyy = tz.getFullYear();
      const mm = String(tz.getMonth()+1).padStart(2,'0');
      const dd = String(tz.getDate()).padStart(2,'0');
      historyDateInput.value = `${yyyy}-${mm}-${dd}`;
    })();

    // ===== 履歴モーダル：開閉 =====
    btnOpenHistory.addEventListener('click', async ()=>{
      historyModal.classList.add('show');
      await populateSessions();
      await loadHistory();
    });
    btnCloseHistory.addEventListener('click', ()=> historyModal.classList.remove('show'));
    btnReload.addEventListener('click', loadHistory);

    // 指定日の「◯人まとめ」を取得してセレクトに反映
    async function populateSessions(){
      sessionSelect.innerHTML = '';
      const dateKey = historyDateInput.value; // 2025-08-19 など
      const rootRef = db.ref(`まとめくくり/${dateKey}`);
      const snap = await rootRef.once('value');
      const obj = snap.val() || {};
      const keys = Object.keys(obj).filter(k => k.endsWith('人まとめ'));

      if(keys.length === 0){
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = '（セッションなし）';
        sessionSelect.appendChild(opt);
        return;
      }
      keys.sort((a,b)=> a.localeCompare(b,'ja'));
      for(const k of keys){
        const o = document.createElement('option');
        o.value = k;
        o.textContent = k; // 例: 5人まとめ
        sessionSelect.appendChild(o);
      }
    }

    // セッション履歴を読み込み（モーダル用）
    async function loadHistory(){
      modalList.innerHTML = '';
      modalStoryConcat.textContent = '';

      const dateKey = historyDateInput.value;
      const sessionKey = sessionSelect.value;
      if(!dateKey || !sessionKey){ return; }

      const ref = db.ref(`まとめくくり/${dateKey}/${sessionKey}`);
      const snap = await ref.once('value');
      const obj = snap.val() || {};
      const entries = Object.entries(obj)
        .filter(([k])=>k !== '_meta')
        .map(([k,v])=>({key:k, ...v}))
        // タイムスタンプ昇順（早い→遅い）
        .sort((a,b)=>(a.タイムスタンプ||0)-(b.タイムスタンプ||0));

      // 連結テキスト
      const concat = entries.map(e=> e.文字 || '').filter(Boolean).join(' ');
      modalStoryConcat.textContent = concat;

      // 一覧
      for(const e of entries){
        const when = new Date(e.タイムスタンプ || Date.now());
        const li = document.createElement('li');
        li.className = 'modalItem';
        li.innerHTML = `
          <div><strong>${escapeHtml(e.文字||'')}</strong></div>
          <div class="modalMeta">${fmtDate(when)}／出席番号: ${escapeHtml(e.出席番号||'-')}／${escapeHtml(e.key)}</div>
        `;
        modalList.appendChild(li);
      }
    }

    // 全文コピー
    btnCopyAll.addEventListener('click', async ()=>{
      const text = modalStoryConcat.textContent || '';
      try{
        await navigator.clipboard.writeText(text);
        toast('コピーしました');
      }catch{ prompt('コピーできない場合はここから手動でコピーしてください', text); }
    });

    // CSV エクスポート
    btnExportCsv.addEventListener('click', ()=>{
      const rows = [['日時','出席番号','テキスト','キー']];
      const items = modalList.querySelectorAll('.modalItem');
      items.forEach(it=>{
        const meta = it.querySelector('.modalMeta').textContent;
        const text = it.querySelector('strong').textContent;
        // 例: 2025-08-19 12:34:56／出席番号: 3／5人目くくり
        const m = meta.match(/^(.*?)／出席番号: (.*?)／(.*)$/);
        const date = m?m[1]:''; const seat = m?m[2]:''; const key = m?m[3]:'';
        rows.push([date, seat, text, key]);
      });
      const csv = rows.map(r=> r.map(csvCell).join(',')).join('\n');
      const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `story_relay_${historyDateInput.value}_${sessionSelect.value||'session'}.csv`;
      document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
    });

    // ===== ヘルパ =====
    function fmtDate(d){
      const pad = n => String(n).padStart(2,'0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }
    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    }
    function csvCell(s){
      const text = String(s||'');
      // ダブルクオートで囲み、内部の" を "" に
      return '"' + text.replace(/"/g,'""') + '"';
    }
    function toast(msg){
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);z-index:60;';
      document.body.appendChild(t); setTimeout(()=> t.remove(), 1600);
    }
function appendSupportItem(v){
  const seat = v.出席番号 || v.座席 || '-';
  const txt  = v.文 || '';
  const when = fmtDate(new Date(v.タイムスタンプ || Date.now()));
  const item = document.createElement('div');
  item.className='msgItem';
  item.innerHTML = `<div><strong>${escapeHtml(txt)}</strong></div>
                    <div class="msgMeta">${when}／出席番号: ${escapeHtml(seat)}</div>`;
  if(elSupportBody.firstChild) elSupportBody.insertBefore(item, elSupportBody.firstChild);
  else elSupportBody.appendChild(item);
  while(elSupportBody.children.length>20){ elSupportBody.lastChild.remove(); }
  elMsgCount.textContent = elSupportBody.children.length;
}


function clearSupportView(){
  elSupportBody.innerHTML='';
  elMsgCount.textContent='0';
}

// /support を購読開始
function attachSupportListener(){
  if(!basePath || supportListenerOn) return;
  supportRef = db.ref(`${basePath}/support`);
  supportRef.on('child_added', snap=>{
    const v=snap.val()||{};
    appendSupportItem(v);
  });
  supportListenerOn = true;
}

// /support の購読解除
function detachSupportListener(){
  if(supportRef && supportListenerOn){
    supportRef.off();
    supportListenerOn=false;
  }
}

// ★ 現在ターンのサポート文を履歴に保存して /support を空にする
async function archiveSupportForTurn(turnLabel){
  if(!basePath) return;
  const ref = db.ref(`${basePath}/support`);
  const snap = await ref.once('value');
  const list=[];
  snap.forEach(c=>{
    const v=c.val()||{};
list.push({
  出席番号: v.出席番号 || v.座席 || '-',
  文: v.文 || '',
  タイムスタンプ: v.タイムスタンプ || Date.now()
});

  });
  if(list.length===0) return; // 何もなければ何もしない
  const histPath = `${basePath}/_supportHistory/${turnLabel}人目くくり`;
  await db.ref(histPath).set({ messages:list, アーカイブ時刻: Date.now() }).catch(()=>{});
  await ref.remove().catch(()=>{});
}

  </script>
</body>
</html>
