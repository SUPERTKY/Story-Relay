<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ストーリーリレー（生徒）</title>
  <style>
:root{ --bg:#0b1022; --fg:#e5e7eb; --muted:#94a3b8; --accent:#60a5fa; --ok:#34d399; --danger:#ef4444; }
html,body{height:100%;margin:0}
body{
  background:
    radial-gradient(1200px 800px at 20% 10%, #142048 0%, transparent 60%),
    radial-gradient(1000px 700px at 80% 90%, #2b1645 0%, transparent 55%),
    linear-gradient(160deg, #0b1022 0%, #121b3a 100%);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans JP",sans-serif;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;
  text-align:center;overflow:hidden;padding:16px;
  animation:bgFloat 16s ease-in-out infinite alternate;
}
@keyframes bgFloat{ 0%{background-position:0 0,0 0,0 0; filter:hue-rotate(0deg)} 100%{background-position:10px -14px,-12px 18px,0 0; filter:hue-rotate(10deg)}}
h1{margin:0 0 4px;font-size:1.4rem;color:var(--muted);font-weight:600}

.card{
  width:min(92vw,560px);
  background:rgba(6,10,24,.8);
  border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  backdrop-filter:blur(6px);
  box-shadow:0 10px 28px rgba(0,0,0,.4);
  padding:16px;
  display:flex;flex-direction:column;gap:12px;align-items:stretch;
}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
input,button{font:inherit;border:none;border-radius:12px;outline:none}
input{
  background:rgba(12,16,30,.9);color:var(--fg);padding:12px 14px;min-width:240px;
  border:1px solid rgba(255,255,255,.12);
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(96,165,250,.2)}
.btn{padding:12px 20px;font-weight:700;cursor:pointer;background:linear-gradient(180deg,#75b6ff,#3b82f6);color:#0b1220}
.btn:disabled{opacity:.6;cursor:not-allowed}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;background:rgba(96,165,250,.15);border:1px solid rgba(96,165,250,.35);color:#bfdbfe;font-weight:700}

.stat{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.kv{ background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1); border-radius:12px;padding:8px 12px;min-width:150px }
.kv small{display:block;color:var(--muted);font-size:.8rem}
.kv strong{font-size:1.1rem}

.note{color:var(--muted);font-size:.9rem}
.count{font-size:.85rem;color:var(--muted)}
.success{color:var(--ok)}
.error{color:#fecaca}
.footer{opacity:.7;font-size:.8rem;margin-top:8px}
  </style>
</head>
<body>
  <h1>ストーリーリレー（生徒）</h1>

  <div class="card">
    <div id="status" class="note">接続中…</div>

    <!-- 開催状況 -->
    <div class="stat">
      <div class="kv">
        <small>開催状況</small>
        <strong id="liveStatus">未検出</strong>
      </div>
      <div class="kv">
        <small>参加人数</small>
        <strong id="statTotal">-</strong>
      </div>
      <div class="kv">
        <small>記録済み人数</small>
        <strong id="statSaved">-</strong>
      </div>
      <div class="kv">
        <small>推定・現在</small>
        <strong id="statNow">- 人目</strong>
      </div>
    </div>

    <!-- サポート文送信（最大20文字） -->
    <div>
      <div class="row" style="justify-content:center">
        <input id="supportText" type="text" maxlength="20" placeholder="先生・発表者へのサポート文（最大20文字）" />
        <button id="btnSend" class="btn" disabled>送信</button>
      </div>
      <div class="count"><span id="remain">残り 20 文字</span>／不適切な内容は送らないでください</div>
      <div id="sendResult" class="note"></div>
    </div>

    <div class="footer">開催が始まると自動接続し、終了すると自動で送信停止します。</div>
  </div>

  <!-- Firebase v8（互換） -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // ===== Firebase 設定（europe-west1 の URL）=====
    const firebaseConfig = {
      apiKey: "AIzaSyBEi8rqSSmEJCcJAf4AcW3QmTIwAjNLb-o",
      authDomain: "story-relay-ec15b.firebaseapp.com",
      databaseURL: "https://story-relay-ec15b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "story-relay-ec15b",
      storageBucket: "story-relay-ec15b.appspot.com",
      messagingSenderId: "423778345800",
      appId: "1:423778345800:web:d72d3569869bc3a789c97d"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db   = firebase.database();

    // ===== DOM =====
    const elStatus    = document.getElementById('status');
    const elLive      = document.getElementById('liveStatus');
    const elTotal     = document.getElementById('statTotal');
    const elSaved     = document.getElementById('statSaved');
    const elNow       = document.getElementById('statNow');
    const elInput     = document.getElementById('supportText');
    const elBtnSend   = document.getElementById('btnSend');
    const elRemain    = document.getElementById('remain');
    const elResult    = document.getElementById('sendResult');

    // ===== 状態 =====
    const today = new Date().toISOString().split('T')[0];
    let basePath = '';        // まとめくくり/<date>/<N>人まとめ（常に最新に追従）
    let meta = { 参加人数: 0, 状態: 'live' };
    let progressOff = null;   // 進行ウォッチ解除関数

    // 入力カウント
    elInput.addEventListener('input', ()=>{
      const left = 20 - (elInput.value||'').length;
      elRemain.textContent = `残り ${left} 文字`;
    });

    // 送信
    elBtnSend.addEventListener('click', async ()=>{
      const text = (elInput.value||'').trim();
      if(!basePath){ toast('開催中ではありません'); return; }
      if(!text){ toast('メッセージを入力してください'); return; }
      if(isEnded()){ toast('このセッションは終了しました'); return; }
      try{
        elBtnSend.disabled = true;
        await db.ref(`${basePath}/support`).push({ 文: text, タイムスタンプ: Date.now() });
        elInput.value=''; elInput.dispatchEvent(new Event('input'));
        showResult('送信しました', true);
      }catch(e){
        showResult('送信に失敗しました: ' + (e.code||e.message), false);
      }finally{
        elBtnSend.disabled = isEnded() || !basePath;
      }
    });

    function showResult(msg, ok){
      elResult.textContent = msg;
      elResult.className = 'note ' + (ok ? 'success' : 'error');
      setTimeout(()=>{ elResult.textContent=''; elResult.className='note'; }, 1800);
    }
    function toast(msg){
      const t = document.createElement('div');
      t.textContent = msg;
      t.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);z-index:60;';
      document.body.appendChild(t); setTimeout(()=> t.remove(), 1600);
    }

    // ===== 匿名ログイン（SESSION） =====
    auth.setPersistence(firebase.auth.Auth.Persistence.SESSION)
      .catch(()=>{})
      .finally(ensureAnon);

    async function ensureAnon(){
      try{
        if(!auth.currentUser){ await auth.signInAnonymously(); }
        elStatus.textContent = '匿名ログイン済み';
        attachDateWatcher();
      }catch(e){
        elStatus.textContent = 'ログイン失敗: ' + (e.code||e.message);
      }
    }

    // ===== 今日のまとめ一覧にリアルタイム追従 =====
    function attachDateWatcher(){
      const dateRef = db.ref(`まとめくくり/${today}`);
      dateRef.on('value', snap=>{
        const obj = snap.val() || {};
        // 「◯人まとめ」を抽出
        const keys = Object.keys(obj).filter(k=>k.endsWith('人まとめ'));
        if(keys.length === 0){
          switchToBasePath('');
          updateUIForNoSession();
          return;
        }
        // _meta.開始時刻 最大のまとめを選択
        let bestKey = ''; let bestTs = -1;
        for(const k of keys){
          const m = obj[k] && obj[k]._meta;
          const ts = (m && m.開始時刻) || 0;
          if(ts > bestTs){ bestTs = ts; bestKey = k; }
        }
        const nextBase = `まとめくくり/${today}/${bestKey}`;
        switchToBasePath(nextBase);
      });
    }

    // セッション切替（既存リスナーの解除→新規リスナー）
    function switchToBasePath(nextPath){
      if(basePath === nextPath) return;
      // 旧セッション監視解除
      if(progressOff){ progressOff(); progressOff = null; }
      basePath = nextPath;

      if(!basePath){
        elLive.textContent = '開催なし';
        elTotal.textContent = '-';
        elSaved.textContent = '-';
        elNow.textContent   = '- 人目';
        elBtnSend.disabled  = true;
        return;
      }

      // 新セッション監視
      const offFns = [];
      // _meta
      const metaRef = db.ref(`${basePath}/_meta`);
      const off1 = metaRef.on('value', s=>{
        meta = s.val() || { 参加人数: 0, 状態: 'live' };
        elTotal.textContent = meta.参加人数 || 0;
        refreshLiveStatus(); // 状態表記を即更新
      });
      offFns.push(()=> metaRef.off('value', off1));

      // 進捗（数字キーのみカウント）
      const sessRef = db.ref(basePath);
      const off2 = sessRef.on('value', s=>{
        const v = s.val() || {};
        const keys = Object.keys(v).filter(k=> /^\d+$/.test(k)); // 1,2,3...
        const saved = keys.length;
        elSaved.textContent = saved;

        const total = meta.参加人数 || 0;
        const now   = Math.min(saved + 1, Math.max(total, 1));
        elNow.textContent = `${now} 人目`;

        refreshLiveStatus(saved, total);
      });
      offFns.push(()=> sessRef.off('value', off2));

      progressOff = ()=> offFns.forEach(fn=>fn());
      // 初期表示
      elStatus.textContent = '開催中のセッションに接続しました';
    }

    // 「開催中 / 終了 / なし」の自動判定とボタン制御
    function refreshLiveStatus(_saved, _total){
      const saved = typeof _saved === 'number' ? _saved : parseInt(elSaved.textContent,10) || 0;
      const total = typeof _total === 'number' ? _total : parseInt(elTotal.textContent,10) || 0;

      if(!basePath){
        elLive.textContent = '開催なし';
        elBtnSend.disabled = true;
        return;
      }
      // 先生側が _meta.状態 を書いていればそれを優先
      if(meta && meta.状態 === 'ended'){
        elLive.textContent = '終了';
        elBtnSend.disabled = true;
        return;
      }
      // 件数から自動終了判定
      if(total > 0 && saved >= total){
        elLive.textContent = '終了';
        elBtnSend.disabled = true;
      }else{
        elLive.textContent = '開催中';
        elBtnSend.disabled = false;
      }
    }
    function isEnded(){
      if(!basePath) return true;
      if(meta && meta.状態 === 'ended') return true;
      const saved = parseInt(elSaved.textContent,10) || 0;
      const total = parseInt(elTotal.textContent,10) || 0;
      return total > 0 && saved >= total;
    }

    function updateUIForNoSession(){
      elStatus.textContent = '今日はまだ開催がありません';
      elLive.textContent   = '開催なし';
      elTotal.textContent  = '-';
      elSaved.textContent  = '-';
      elNow.textContent    = '- 人目';
      elBtnSend.disabled   = true;
    }
  </script>
</body>
</html>
