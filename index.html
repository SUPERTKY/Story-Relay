<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Relay タイトル</title>
  <style>
    :root { --bg-url: url('assets/taitoru.png'); }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    /* 背景そのまま表示（黒くならないように） */
    body {
      background: var(--bg-url) center/cover no-repeat; /* fixed は外す（iOS描画バグ回避） */
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      overflow: hidden;
      cursor: pointer; /* タップ可能であることを示す */
    }

    /* 遷移時にだけ使う黒いベール（フェード“インしてから”移動） */
    .veil {
      position: fixed; inset: 0; background: #000; opacity: 0;
      transition: opacity 600ms ease; /* 遷移前フェード時間 */
      pointer-events: none; z-index: 3; /* 最前面 */
    }
    .veil.show { opacity: 1; }

    /* 自動再生ブロック時のオーバーレイ */
    .sound-gate {
      position: fixed; inset: 0; display: none;
      background: rgba(0,0,0,.55); backdrop-filter: blur(3px);
      align-items: center; justify-content: center; z-index: 4; /* ベールより上 */
    }
    .gate-card {
      background: rgba(20,20,20,.7);
      padding: 24px 28px; border-radius: 16px;
      max-width: 480px; width: min(90%, 480px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      color: #fff; text-align: center; font-family: sans-serif;
    }
    .gate-title { font-size: 1.25rem; margin: 0 0 8px; }
    .gate-desc  { font-size: .95rem; opacity: .9; margin: 0 0 16px; }
    .gate-btn   {
      display: inline-block; width: 100%; padding: 12px 16px;
      border-radius: 999px; border: none; cursor: pointer; font-weight: 700;
      background: #ffd166; color: #222; box-shadow: 0 6px 16px rgba(0,0,0,.3);
    }
    .gate-btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <audio id="bgm" src="assets/taitoru.mp3" preload="auto" autoplay loop playsinline></audio>

  <div class="sound-gate" id="soundGate" aria-hidden="true">
    <div class="gate-card">
      <p class="gate-title">サウンドをオンにしますか？</p>
      <p class="gate-desc">ブラウザの仕様により自動再生がブロックされました。ボタンを押すと音楽が流れます。</p>
      <button class="gate-btn" id="enableSound">音をオンにする</button>
    </div>
  </div>

  <!-- 遷移時だけ使う黒ベール -->
  <div class="veil" id="veil"></div>

  <script>
    (function(){
      const audio = document.getElementById('bgm');
      const gate  = document.getElementById('soundGate');
      const btn   = document.getElementById('enableSound');
      const veil  = document.getElementById('veil');

      // ---- BGM 自動再生（失敗時はゲート表示） ----
      const tryPlay = () => audio.play().catch(() => {
        gate.style.display = 'flex';
        gate.setAttribute('aria-hidden', 'false');
      });
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        tryPlay();
      } else {
        document.addEventListener('DOMContentLoaded', tryPlay, { once: true });
      }
      btn.addEventListener('click', async () => {
        try {
          await audio.play();
          gate.style.display = 'none';
          gate.setAttribute('aria-hidden', 'true');
        } catch (e) {
          try { audio.muted = true; await audio.play(); setTimeout(() => { audio.muted = false; }, 100);
                gate.style.display = 'none'; gate.setAttribute('aria-hidden', 'true'); }
          catch(err){ console.warn('Audio play failed:', err); }
        }
      });

      // ---- タップで「黒くフェードイン」してから next.html に遷移 ----
      let navigating = false;
      const DURATION = 600; // CSSのtransitionと同じ

      function goNextAfterFade(){
        if (navigating) return;
        // サウンドゲートが開いている間は遷移させない
        const gateOpen = gate.getAttribute('aria-hidden') === 'false' || gate.style.display === 'flex';
        if (gateOpen) return;
        navigating = true;
        // 次フレームで .show を付けて黒をフェードイン
        veil.offsetHeight; // reflow for safety
        veil.classList.add('show');

        const done = () => { window.location.href = 'next.html'; };
        // どのブラウザでも確実に遷移するよう両方用意
        const to = setTimeout(done, DURATION + 80);
        const onEnd = (e) => {
          if (e.propertyName === 'opacity') {
            veil.removeEventListener('transitionend', onEnd);
            clearTimeout(to); done();
          }
        };
        veil.addEventListener('transitionend', onEnd);
      }

      document.addEventListener('click', goNextAfterFade);
      // キーボード/ゲームパッドなどにも対応したければ↓を有効化
      // document.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') goNextAfterFade(); });
    })();
  </script>
</body>
</html>
