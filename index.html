<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Relay タイトル</title>
  <style>
    /* 背景画像を assets から読み込み、元のグラデをブレンド */
    :root {
      --bg-url: url('assets/taitoru.png'); /* ここを assets の実ファイル名に合わせて変更 */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Apple Color Emoji", "Segoe UI Emoji";
      /* assets の画像をベースにしつつ、上にグラデを重ねる */
      background: var(--bg-url) center/cover no-repeat fixed;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* 元のグラデトーンを上に重ねて雰囲気維持 */
    body::before {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(26,42,108,.6), rgba(178,31,31,.45), rgba(253,187,45,.35));
      pointer-events: none;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      margin: 0 0 20px;
      letter-spacing: .02em;
      z-index: 1; /* グラデの上に */
      text-shadow: 0 6px 18px rgba(0,0,0,.45);
    }

    /* 自動再生がブロックされた時だけ出すオーバーレイ */
    .sound-gate {
      position: fixed; inset: 0;
      display: none; /* 既定は非表示。失敗時にJSで表示 */
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
      z-index: 2;
    }
    .gate-card {
      background: rgba(20,20,20,.7);
      padding: 24px 28px; border-radius: 16px;
      max-width: 480px; width: min(90%, 480px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }
    .gate-title { font-size: 1.25rem; margin: 0 0 8px; }
    .gate-desc { font-size: .95rem; opacity: .9; margin: 0 0 16px; }
    .gate-btn {
      display: inline-block; width: 100%;
      padding: 12px 16px; border-radius: 999px;
      border: none; cursor: pointer; font-weight: 700;
      background: #ffd166; color: #222;
      box-shadow: 0 6px 16px rgba(0,0,0,.3);
    }
    .gate-btn:active { transform: translateY(1px); }

    /* 低視力/簡易モーション配慮 */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <h1>Story Relay</h1>

  <!-- コントロールは出さず、自動再生を試みる。iOS対応のため playsinline を付与 -->
  <audio id="bgm" src="assets/taitoru.mp3" preload="auto" autoplay loop playsinline></audio>

  <!-- 自動再生がブロックされた場合のフォールバックUI -->
  <div class="sound-gate" id="soundGate" aria-hidden="true">
    <div class="gate-card">
      <p class="gate-title">サウンドをオンにしますか？</p>
      <p class="gate-desc">ブラウザの仕様により自動再生がブロックされました。ボタンを押すと音楽が流れます。</p>
      <button class="gate-btn" id="enableSound">音をオンにする</button>
    </div>
  </div>

  <script>
    // 可能なら即時自動再生。失敗時は案内オーバーレイを表示
    (function() {
      const audio = document.getElementById('bgm');
      const gate = document.getElementById('soundGate');
      const btn  = document.getElementById('enableSound');

      // 一部ブラウザは muted なら自動再生許可されるが、音を出したいのでまず通常再生を試す
      const tryPlay = () => audio.play().catch(() => {
        // 失敗: ユーザー操作待ち
        gate.style.display = 'flex';
        gate.setAttribute('aria-hidden', 'false');
      });

      // DOM 準備後に試行
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        tryPlay();
      } else {
        document.addEventListener('DOMContentLoaded', tryPlay, { once: true });
      }

      // ユーザーが押したら確実に再生
      btn.addEventListener('click', async () => {
        try {
          await audio.play();
          gate.style.display = 'none';
          gate.setAttribute('aria-hidden', 'true');
        } catch (e) {
          // それでも失敗したら、最後の手段: 一瞬ミュートで再生→すぐアンミュート
          try {
            audio.muted = true;
            await audio.play();
            setTimeout(() => { audio.muted = false; }, 100);
            gate.style.display = 'none';
            gate.setAttribute('aria-hidden', 'true');
          } catch (err) {
            console.warn('Audio play failed:', err);
          }
        }
      });
    })();
  </script>
</body>
</html>
