<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Relay タイトル</title>
  <style>
    :root { --bg-url: url('assets/taitoru.png'); }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    /* 背景はそのまま表示。bodyのopacityは触らない（黒くならないように） */
    body {
      background: var(--bg-url) center/cover no-repeat; /* ← fixed を外す（iOS/Safariの描画バグ回避） */
      display: flex; justify-content: center; align-items: center; flex-direction: column;
      overflow: hidden;
      cursor: pointer; /* タップ可能であることを示す */
    }

    /* 初回だけ黒いベールを上に重ね、透明へフェードさせる */
    .veil {
      position: fixed; inset: 0; background: #000; opacity: 1;
      transition: opacity 1200ms ease-in; /* フェードイン時間 */
      pointer-events: none; /* クリックを妨げない */
      z-index: 2;
    }
    .veil.hidden { opacity: 0; }

    .sound-gate {
      position: fixed; inset: 0;
      display: none;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
      z-index: 3; /* ベールより上 */
    }
    .gate-card {
      background: rgba(20,20,20,.7);
      padding: 24px 28px; border-radius: 16px;
      max-width: 480px; width: min(90%, 480px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      color: #fff; text-align: center; font-family: sans-serif;
    }
    .gate-title { font-size: 1.25rem; margin: 0 0 8px; }
    .gate-desc { font-size: .95rem; opacity: .9; margin: 0 0 16px; }
    .gate-btn {
      display: inline-block; width: 100%;
      padding: 12px 16px; border-radius: 999px; border: none; cursor: pointer; font-weight: 700;
      background: #ffd166; color: #222; box-shadow: 0 6px 16px rgba(0,0,0,.3);
    }
    .gate-btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <audio id="bgm" src="assets/taitoru.mp3" preload="auto" autoplay loop playsinline></audio>

  <div class="sound-gate" id="soundGate" aria-hidden="true">
    <div class="gate-card">
      <p class="gate-title">サウンドをオンにしますか？</p>
      <p class="gate-desc">ブラウザの仕様により自動再生がブロックされました。ボタンを押すと音楽が流れます。</p>
      <button class="gate-btn" id="enableSound">音をオンにする</button>
    </div>
  </div>

  <!-- 初回だけ黒いベールをかけて、読み込み直後に透明化（= 画面はフェードイン表示） -->
  <div class="veil" id="veil"></div>

  <script>
    (function() {
      const audio = document.getElementById('bgm');
      const gate  = document.getElementById('soundGate');
      const btn   = document.getElementById('enableSound');
      const veil  = document.getElementById('veil');

      // 1) 画面フェードイン: ベールを透明化
      let canNavigate = false; // フェードイン完了までは遷移不可
      const FADE_MS = 1200;

      function startVeilFadeIn(){
        // 次フレームで透明化クラスを付与
        requestAnimationFrame(() => veil.classList.add('hidden'));
        // transitionend が来ない環境向けフォールバック
        setTimeout(() => { canNavigate = true; }, FADE_MS + 80);
      }

      veil.addEventListener('transitionend', (e) => {
        if (e.propertyName === 'opacity') canNavigate = true;
      });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', startVeilFadeIn, { once: true });
      } else {
        startVeilFadeIn();
      }

      // 2) BGM 自動再生（失敗時はオーバーレイ）
      const tryPlay = () => audio.play().catch(() => {
        gate.style.display = 'flex';
        gate.setAttribute('aria-hidden', 'false');
      });
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        tryPlay();
      } else {
        document.addEventListener('DOMContentLoaded', tryPlay, { once: true });
      }

      btn.addEventListener('click', async () => {
        try {
          await audio.play();
          gate.style.display = 'none';
          gate.setAttribute('aria-hidden', 'true');
        } catch (e) {
          try {
            audio.muted = true;
            await audio.play();
            setTimeout(() => { audio.muted = false; }, 100);
            gate.style.display = 'none';
            gate.setAttribute('aria-hidden', 'true');
          } catch (err) {
            console.warn('Audio play failed:', err);
          }
        }
      });

      // 3) クリックで遷移。ただしフェードイン完了までは無視 + サウンドゲート表示中も無視
      document.addEventListener('click', () => {
        const gateOpen = gate.getAttribute('aria-hidden') === 'false' || gate.style.display === 'flex';
        if (!canNavigate || gateOpen) return;
        window.location.href = 'next.html';
      });
    })();
  </script>
</body>
</html>
