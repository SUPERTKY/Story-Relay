<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Story Relay タイトル</title>
  <style>
    :root {
      --bg-url: url('assets/taitoru.png'); /* 背景画像ファイル名に合わせて変更 */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      background: var(--bg-url) center/cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      overflow: hidden;
    }

    /* 自動再生がブロックされた時だけ出すオーバーレイ */
    .sound-gate {
      position: fixed; inset: 0;
      display: none;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(3px);
      align-items: center; justify-content: center;
      z-index: 2;
    }
    .gate-card {
      background: rgba(20,20,20,.7);
      padding: 24px 28px; border-radius: 16px;
      max-width: 480px; width: min(90%, 480px);
      box-shadow: 0 10px 30px rgba(0,0,0,.5);
      color: #fff;
      text-align: center;
      font-family: sans-serif;
    }
    .gate-title { font-size: 1.25rem; margin: 0 0 8px; }
    .gate-desc { font-size: .95rem; opacity: .9; margin: 0 0 16px; }
    .gate-btn {
      display: inline-block; width: 100%;
      padding: 12px 16px; border-radius: 999px;
      border: none; cursor: pointer; font-weight: 700;
      background: #ffd166; color: #222;
      box-shadow: 0 6px 16px rgba(0,0,0,.3);
    }
    .gate-btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <!-- 自動再生を試みる。iOS対応のため playsinline を付与 -->
  <audio id="bgm" src="assets/taitoru.mp3" preload="auto" autoplay loop playsinline></audio>

  <!-- 自動再生がブロックされた場合のフォールバックUI -->
  <div class="sound-gate" id="soundGate" aria-hidden="true">
    <div class="gate-card">
      <p class="gate-title">サウンドをオンにしますか？</p>
      <p class="gate-desc">ブラウザの仕様により自動再生がブロックされました。ボタンを押すと音楽が流れます。</p>
      <button class="gate-btn" id="enableSound">音をオンにする</button>
    </div>
  </div>

  <script>
    (function() {
      const audio = document.getElementById('bgm');
      const gate = document.getElementById('soundGate');
      const btn  = document.getElementById('enableSound');

      const tryPlay = () => audio.play().catch(() => {
        gate.style.display = 'flex';
        gate.setAttribute('aria-hidden', 'false');
      });

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        tryPlay();
      } else {
        document.addEventListener('DOMContentLoaded', tryPlay, { once: true });
      }

      btn.addEventListener('click', async () => {
        try {
          await audio.play();
          gate.style.display = 'none';
          gate.setAttribute('aria-hidden', 'true');
        } catch (e) {
          try {
            audio.muted = true;
            await audio.play();
            setTimeout(() => { audio.muted = false; }, 100);
            gate.style.display = 'none';
            gate.setAttribute('aria-hidden', 'true');
          } catch (err) {
            console.warn('Audio play failed:', err);
          }
        }
      });
    })();
  </script>
</body>
</html>
